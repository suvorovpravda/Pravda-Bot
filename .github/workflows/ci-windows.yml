name: CI Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify syntax and imports
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q .
          python -c "import alert_gate, analyze_spreads, analyze_paper_results, bot_config, bot_dashboard, csv_schema, dashboard, lng_observations, market_data_health, paper_simulator, security_and_fees; print('Imports passed.')"
          python analyze_spreads.py --help

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

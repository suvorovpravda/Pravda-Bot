name: Resolve desktop updater lockfile candidate
on:
  push:
    branches: [feat/tauri-signed-updater-runtime-20261106]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lockfile:
    name: Resolve Windows updater dependencies without repository writes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve isolated Tauri desktop Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --manifest-path crates/pravda-app/Cargo.toml
          cargo fmt --all --manifest-path crates/pravda-app/Cargo.toml
          cargo tree --manifest-path crates/pravda-app/Cargo.toml --target x86_64-pc-windows-msvc --features signed-updater -e features | grep -F tauri-plugin-updater >/dev/null
      - name: Emit public lockfile and rustfmt results for verified Git commit
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'lock|crates/pravda-app/Cargo.lock' \
            'main|crates/pravda-app/src/main.rs' \
            'ipc|crates/pravda-app/src/ipc.rs' \
            'updater|crates/pravda-app/src/updater.rs' \
            'build|crates/pravda-app/build.rs'; do
            key="${spec%%|*}"
            file="${spec#*|}"
            echo "PRAVDA_PUBLIC_EXPORT_BEGIN:${key}"
            base64 -w0 "$file" | fold -w 2000
            echo "PRAVDA_PUBLIC_EXPORT_END:${key}"
          done
      - name: Export candidate lockfile (untrusted until CI checks it)
        uses: actions/upload-artifact@v7
        with:
          name: pravda-desktop-updater-lockfile-candidate
          path: |
            crates/pravda-app/Cargo.lock
            crates/pravda-app/src/main.rs
            crates/pravda-app/src/ipc.rs
            crates/pravda-app/src/updater.rs
            crates/pravda-app/build.rs
          if-no-files-found: error
          retention-days: 1

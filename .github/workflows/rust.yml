name: Rust migration
on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - '**/rust/**'}]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python for PyO3 detection
        id: python
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            echo "PYTHON_PATH=Scripts/python.exe" >> $GITHUB_OUTPUT
          else
            echo "PYTHON_PATH=bin/python" >> $GITHUB_OUTPUT
          fi
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Install maturin (for PyO3 wheel build)
        run: pip install maturin
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Check workspace
        run: cargo fmt --all -- --check
      
      - name: Clippy (without warnings as error for incremental migration)
        run: cargo clippy --workspace --all-targets --allow-dirty
      
      - name: Test workspace with PyO3 environment
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.PYTHON_PATH }}
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
        run: cargo test --workspace

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Check workspace (MSRV-compatible toolchain)
        run: cargo fmt --all -- --check
      
      - name: Test PyO3 module with MSRV toolchain
        env:
          PYO3_PYTHON: python3
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
        run: |
          cd rust/market-core
          cargo test --workspace

  build-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Install maturin
        run: pip install maturin
      
      - name: Build PyO3 wheel (for release automation)
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
        run: |
          cd rust/market-core
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 maturin build --release --out dist
      
      - uses: actions/upload-artifact@v4
        with:
          name: pravda-wheel-ubuntu
          path: rust/market-core/dist/*.whl
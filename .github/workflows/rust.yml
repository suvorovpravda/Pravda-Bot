name: Rust migration

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
      - 'dashboard.html'
      - 'tests_js/**'
      - '**/rust/**'
      - 'crates/**'
      - 'tools/**'
      - 'archive/**'
      - '.gitattributes'
      - '.github/dependabot.yml'
      - 'README.md'
      - 'SECURITY.md'
      - 'docs/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact checked-out source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Checked-out SHA differs from the required source SHA"
            exit 1
          fi
          echo "Verified source SHA=$actual"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Dashboard JavaScript regression tests
        run: node tools/test-dashboard.mjs
      - name: Dashboard polling and security Node tests
        run: node --test tests_js/dashboard-polling.test.cjs tests_js/dashboard-security.test.cjs
      - name: Native bundled IPC frontend security contract
        run: node tools/test-desktop-ipc.mjs
      - name: Signed Windows updater metadata tampering contracts
        run: node tools/test-updater-release.mjs
      - name: Offline Windows VM GUI acceptance contract (source check only)
        run: node tools/test-airgap-acceptance-contract.mjs
      - name: Windows installer verifier synthetic tampering tests
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./tools/test-windows-installer-verifier.ps1

      - name: Verify immutable remote GitHub Actions dependency pins
        run: node tools/test-github-actions-pinning.mjs
      - name: Validate SonarCloud Python version and source/test analysis scope
        run: node tools/test-sonarcloud-analysis.mjs
      - name: Enforce Rust-only production boundary
        run: node tools/test-rust-production-boundary.mjs

      - name: Verify single documentation, links and prioritized progress percentages
        run: node tools/test-docs-consistency.mjs

      - name: Fmt check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Air-gapped Rust harness smoke (parallel, gate rejection, timeout)
        run: cargo run --locked -p pravda-server --bin pravda-harness -- --smoke

      - name: Inspect dependency tree
        run: cargo tree --locked --workspace

      - name: Build backend in release mode
        run: cargo build --locked --release --workspace

  doctor_windows:
    name: Build and verify one-click Pravda Doctor
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Enforce exact checked-out source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Checked-out SHA differs from the required source SHA"
            exit 1
          fi
          echo "Verified source SHA=$actual"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Check Doctor formatting and tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo test --locked -p pravda-server --bin pravda-doctor
          if ($LASTEXITCODE -ne 0) { throw 'Doctor tests failed' }
      - name: Build independent Windows diagnostic EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked --release -p pravda-server --bin pravda-doctor
          if ($LASTEXITCODE -ne 0) { throw 'Doctor release compilation failed' }
          $exe = 'target/release/pravda-doctor.exe'
          $file = Get-Item -LiteralPath $exe -ErrorAction Stop
          if ($file.Length -lt 100000) { throw 'Doctor executable is unexpectedly small' }
          $bytes = [IO.File]::ReadAllBytes($file.FullName)
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw 'Doctor is not a Windows PE executable' }
          $output = @(& $exe --no-open)
          if ($LASTEXITCODE -ne 0) { throw 'Doctor failed at startup' }
          if (($output -join "`n") -notmatch 'PRAVDA-DOCTOR REPORT v2' -or
              ($output -join "`n") -notmatch 'SUMMARY') {
            throw 'Doctor diagnostic output is missing'
          }
          Write-Host 'Doctor release executable generated and startup report verified.'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pravda-doctor-windows-unsigned-test
          path: target/release/pravda-doctor.exe
          if-no-files-found: error
          retention-days: 7

  secret_history_audit:
    name: Secret boundary and full Git history audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce exact checked-out source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Checked-out SHA differs from the required source SHA"
            exit 1
          fi
          echo "Verified source SHA=$actual"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Check private credential isolation and fetched history
        run: node tools/test-secret-boundary.mjs

  msrv:
    name: Rust MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact checked-out source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Checked-out SHA differs from the required source SHA"
            exit 1
          fi
          echo "Verified source SHA=$actual"
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0

      - name: Check workspace with MSRV
        run: cargo check --locked --workspace --all-targets

  portable_windows_release:
    name: Build and verify portable Windows release executable
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Enforce exact checked-out source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Checked-out SHA differs from the required source SHA"
            exit 1
          fi
          echo "Verified source SHA=$actual"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Enforce reproducible Tauri desktop lockfile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo metadata --locked --format-version 1 --manifest-path crates/pravda-app/Cargo.toml | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Tauri Cargo.lock is stale" }
          git diff --exit-code -- crates/pravda-app/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw "Tauri Cargo.lock changed during resolution" }
      - name: Build Windows release executable from locked sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked --release --manifest-path crates/pravda-app/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Release build failed" }
      - name: Verify PE executable, isolated launch and no listening socket
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path (Get-Location).Path 'crates/pravda-app/target/release/pravda-app.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Release executable missing" }
          $info = Get-Item -LiteralPath $exe
          if ($info.Length -lt 100000) { throw "Release executable unreasonably small" }
          $stream = [System.IO.File]::OpenRead($exe)
          try {
            $header = New-Object byte[] 2
            if ($stream.Read($header, 0, 2) -ne 2 -or $header[0] -ne 0x4D -or $header[1] -ne 0x5A) {
              throw "Release file is not a Windows PE executable"
            }
          } finally { $stream.Dispose() }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Verified Windows release PE build: SHA-256=$hash; bytes=$($info.Length)"
          $env:PRAVDA_MARKET_FEEDS_ENABLED = 'false'
          $env:PRAVDA_DB_PATH = Join-Path $env:RUNNER_TEMP 'pravda-release-smoke.db'
          $env:PRAVDA_AUTH_PATH = Join-Path $env:RUNNER_TEMP 'pravda-release-smoke-auth.json'
          Remove-Item Env:PRAVDA_LEGACY_DB_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:MARKET_HISTORY_DB -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath $exe -WorkingDirectory (Get-Location).Path -PassThru
          try {
            $started = $false
            for ($i = 0; $i -lt 60; $i++) {
              $app.Refresh()
              if ($app.HasExited) { throw "Windows release process exited early: $($app.ExitCode)" }
              if (Test-Path -LiteralPath $env:PRAVDA_DB_PATH) { $started = $true; break }
              Start-Sleep -Milliseconds 250
            }
            if (-not $started) { throw 'Release executable did not initialize isolated SQLite' }
            Start-Sleep -Seconds 3
            $app.Refresh()
            if ($app.HasExited) { throw "Release executable terminated after startup" }
            $listeners = @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
              Where-Object { $_.OwningProcess -eq $app.Id })
            if ($listeners.Count -gt 0) { throw 'Windows release executable opened an unexpected local HTTP port' }
            if (Test-Path -LiteralPath $env:PRAVDA_AUTH_PATH) { throw 'Release startup wrote an unexpected password verifier' }
            Write-Host "Release executable startup, SQLite and no HTTP listener verified."
            Write-Host "Requires a compatible Windows WebView2 Runtime; no code-signing claim."
          } finally {
            $app.Refresh()
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

  desktop_windows:
    name: Windows desktop build and startup
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enforce exact checked-out source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Checked-out SHA differs from the required source SHA"
            exit 1
          fi
          echo "Verified source SHA=$actual"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Verify Tauri formatting
        run: cargo fmt --manifest-path crates/pravda-app/Cargo.toml -- --check
      - name: Verify desktop Cargo.lock remains unchanged
        shell: pwsh
        run: |
          cargo metadata --locked --no-deps --format-version 1 --manifest-path crates/pravda-app/Cargo.toml | Out-Null
          git diff --exit-code -- crates/pravda-app/Cargo.lock

      - name: Test desktop storage path selection (Windows)
        run: cargo test --locked --manifest-path crates/pravda-app/Cargo.toml
      - name: Build native Windows desktop application
        run: cargo build --locked --manifest-path crates/pravda-app/Cargo.toml
      - name: Verify opt-in security E2E probe compiles on Windows (not executed in ordinary app)
        run: cargo check --locked --manifest-path crates/pravda-app/Cargo.toml --features security-e2e
      - name: Launch bundled desktop and assert no local HTTP listener
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PRAVDA_MARKET_FEEDS_ENABLED = "false"
          $env:PRAVDA_DB_PATH = Join-Path $env:RUNNER_TEMP "pravda-ipc-desktop-smoke.db"
          $env:PRAVDA_AUTH_PATH = Join-Path $env:RUNNER_TEMP "pravda-ipc-desktop-auth.json"
          Remove-Item Env:PRAVDA_LEGACY_DB_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:MARKET_HISTORY_DB -ErrorAction SilentlyContinue
          $executable = Join-Path (Get-Location).Path "crates/pravda-app/target/debug/pravda-app.exe"
          if (-not (Test-Path $executable)) { throw "Bundled desktop executable not found" }
          $app = Start-Process -FilePath $executable -PassThru
          try {
            $started = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              $app.Refresh()
              if ($app.HasExited) { throw "Bundled desktop exited with code $($app.ExitCode)" }
              if (Test-Path $env:PRAVDA_DB_PATH) { $started = $true; break }
              Start-Sleep -Milliseconds 250
            }
            if (-not $started) { throw "Desktop did not initialize isolated SQLite" }
            Start-Sleep -Seconds 3
            $app.Refresh()
            if ($app.HasExited) { throw "Desktop exited after database initialization" }
            $listeners = @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
              Where-Object { $_.OwningProcess -eq $app.Id })
            if ($listeners.Count -ne 0) { throw "Desktop started unexpected listening socket(s)" }
            if (Test-Path $env:PRAVDA_AUTH_PATH) {
              throw "Unauthenticated startup unexpectedly wrote a password verifier"
            }
            Write-Host "Bundled desktop launch, SQLite startup and no local HTTP listener verified."
            Write-Host "Interactive IPC/ACL denial is verified separately by the native Windows WebView2 security E2E job."
          } finally {
            $app.Refresh()
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }


  security_native_webview2:
    name: Windows native WebView2 IPC security E2E
    # PR #67 was merged: this guard must run on EVERY PR and push to main,
    # not only on the historical security branch (which would silently skip).
    # No auto-merge: branch protection settings decide the required checks.

    # Temporary WebView2/EdgeDriver upstream compatibility workaround.
    # See actions/runner-images#14738: windows-2025 DevToolsActivePort failure.
    # Keep fail-closed; move back only after native E2E passes.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enforce exact checked-out source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Checked-out SHA differs from the required source SHA"
            exit 1
          fi
          echo "Verified source SHA=$actual"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Build opt-in DEBUG security probe (no release capabilities changed)
        run: cargo build --locked --manifest-path crates/pravda-app/Cargo.toml --features security-e2e

      - name: Diagnose stale Tauri lockfile after locked-build failure (non-gating diagnostic)
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # The preceding --locked build remains mandatory and failed closed.
          # Resolve only to inspect Cargo's proposed lockfile diff; never build or commit it here.
          cargo metadata --format-version 1 --no-deps --manifest-path crates/pravda-app/Cargo.toml | Out-Null
          git diff -- crates/pravda-app/Cargo.lock

      - name: Install Tauri's native Windows WebDriver adapter
        run: cargo install tauri-driver --version '=2.1.0' --locked

      - name: Download matching EdgeDriver from Microsoft only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Tauri WebView2 uses Microsoft Edge WebView2 Runtime, NOT the
          # separate msedge.exe browser. Driver major must match runtime.
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $webview = Get-ItemProperty -LiteralPath $key -ErrorAction SilentlyContinue
          $version = $webview.pv
          if (-not $version -or $version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Cannot determine installed Microsoft WebView2 Runtime version; fail closed"
          }
          Write-Host "WebView2 Runtime version $version (registry)"
          $zipPath = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          $binDir = Join-Path $env:RUNNER_TEMP 'edgedriver-bin'
          $uri = "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip"
          Invoke-WebRequest -Uri $uri -OutFile $zipPath -ErrorAction Stop
          Expand-Archive -LiteralPath $zipPath -DestinationPath $binDir
          if (-not (Test-Path (Join-Path $binDir 'msedgedriver.exe'))) {
            throw "Microsoft EdgeDriver binary missing"
          }
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Matched Microsoft EdgeDriver version $version"
          "PRAVDA_E2E_WEBVIEW2_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PRAVDA_E2E_WINDOWS_VERSION=$([System.Environment]::OSVersion.VersionString)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Execute native IPC deny tests (no JS mocks)
        shell: pwsh
        env:
          PRAVDA_E2E_REPORT: ${{ runner.temp }}/Pravda-IPC-security-report.json
        run: |
          $ErrorActionPreference = 'Stop'
          node tools/test-ipc-security-windows.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify native E2E report against checked-out SHA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'Pravda-IPC-security-report.json'
          if (-not (Test-Path -LiteralPath $path)) {
            throw "Native E2E report missing: refuse success"
          }
          $report = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          if ($report.passed -ne $true) { throw "Native IPC E2E report is not passed" }
          $checkedOutSha = (git rev-parse HEAD).Trim()
          if ($report.git_sha -cne $checkedOutSha) {
            throw "Evidence SHA does not match checked out commit"
          }
          if ($report.webview2_version -notmatch '^\d+\.\d+\.\d+\.\d+$' -or
              -not $report.windows_version) {
            throw "Native E2E report must specify Windows OS and WebView2 runtime versions"
          }
          $tests = @($report.tests)
          if ($tests.Count -lt 22) { throw "Incomplete native E2E test coverage" }
          if (@($tests | Where-Object { $_.passed -ne $true }).Count -ne 0) {
            throw "One or more native IPC assertions failed"
          }
          $required = @(
            'no session: ipc_market_snapshot',
            'no session: ipc_history_export_csv',
            'main: authenticated snapshot',
            'main: logout revokes market access',
            'security-probe: bootstrap auth_status denied',
            'security-probe: market snapshot denied',
            'security-probe: no arbitrary disk modification',
            'security-probe: shell plugin denied',
            'concurrent: ipc_auth_status denied with main authenticated',
            'concurrent: ipc_session_check denied with main authenticated',
            'concurrent: ipc_market_snapshot denied with main authenticated',
            'concurrent: ipc_history_recent denied with main authenticated',
            'concurrent: ipc_history_query denied with main authenticated',
            'concurrent: ipc_history_export_csv denied with main authenticated',
            'concurrent: ipc_paper_alerts_snapshot denied with main authenticated',
            'concurrent: ipc_runtime_metrics denied with main authenticated',
            'concurrent: ipc_security_report denied with main authenticated',
            'concurrent: ipc_security_events denied with main authenticated',
            'concurrent: ipc_revolut_consent_get denied with main authenticated',
            'concurrent: ipc_revolut_consent_set denied with main authenticated',
            'opt-in: Revolut public network disabled by default',
            'opt-in: native Rust refuses public book without consent',
            'opt-in: explicit consent survives desktop restart',
            'opt-in: revocation persists and blocks network read',
            'concurrent: ipc_fx_status denied with main authenticated',
            'concurrent: plugin:fs|write_text_file denied with main authenticated',
            'concurrent: plugin:shell|execute denied with main authenticated',
            'main: native WebView2 CSP blocks injected inline script',
            'main: authenticated again for hostile HTTPS test',
            'restart: password setup persisted across native process',
            'restart: old session revoked after native process exit',
            'security: unauthenticated user cannot read security status',
            'security: unauthenticated user cannot read security events',
            'security: invalid login is denied with a safe fixed error',
            'restart: existing password logs in',
            'security: authenticated status is bounded and VPN remains unverified',
            'security: authenticated local events contain only coded auth outcomes',
            'restart: market IPC authorized only after login',
            'restart: SQLite remains accessible'
          )
          foreach ($name in $required) {
            if (@($tests | Where-Object { $_.name -eq $name -and $_.passed -eq $true }).Count -ne 1) {
              throw "Required native assertion absent: $name"
            }
          }
          $hostileEvidence = @($tests | Where-Object { $_.passed -eq $true -and
            ($_.name -eq 'untrusted HTTPS origin cannot invoke market IPC' -or
             $_.name -eq 'untrusted HTTPS navigation blocked in authenticated main window') })
          if ($hostileEvidence.Count -ne 1) {
            throw "Missing controlled HTTPS-hostile-origin native test outcome"
          }
          Write-Host "Verified $($tests.Count) native WebView2 security assertions on $checkedOutSha."

      - name: Attach redacted JSON test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pravda-windows-native-ipc-security
          path: ${{ runner.temp }}/Pravda-IPC-security-report.json
          if-no-files-found: error

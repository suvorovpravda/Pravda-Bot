name: Prepare PR-02 Rust locks and formatting once
on:
  push:
    branches: [fix/pr02-runtime-cargo-validation]
    paths: [.github/workflows/prepare-pr02-locks-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Apply formatting and update only workspace packages in both lockfiles
        run: |
          cargo fmt --all
          cargo fmt --manifest-path crates/pravda-app/Cargo.toml
          cargo update --workspace
          cargo update --manifest-path crates/pravda-app/Cargo.toml --workspace
      - name: Verify extracted core and server compile before committing
        run: |
          cargo test --locked -p pravda-core --lib
          cargo test --locked -p pravda-server --lib
      - name: Remove temporary workflow and commit formatted sources and lockfiles
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-pr02-locks-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet || {
            git commit -m "chore(pr02): update Cargo locks and format extracted runtime"
            git push origin HEAD:fix/pr02-runtime-cargo-validation
          }

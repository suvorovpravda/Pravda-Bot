name: Publish validated Pravda-Bot v0.3.1 prerelease once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v031-once.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    name: Verify existing Windows release artifact and create v0.3.1
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 1d46aa7236efaa164dc2346b1ffc82fddbb40802
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1d46aa7236efaa164dc2346b1ffc82fddbb40802
      - uses: actions/download-artifact@v4
        with:
          name: pravda-bot-v0.3.1-windows
          run-id: 41357947462
          repository: suvorovpravda/Pravda-Bot
          github-token: ${{ github.token }}
          path: release-dist
      - name: Validate exact source, CI, release asset and tag uniqueness
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          changed="$(gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...$current" --jq '.files[].filename')"
          test "$changed" = ".github/workflows/publish-v031-once.yml" || {
            echo "Unexpected main source changes; release aborted"
            exit 1
          }
          for run in 41357745029 41357745028; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" \
              --jq '.head_sha + " " + .conclusion' |
              grep -Fx "$SOURCE_SHA success" || {
                echo "Mandatory source CI failed or commit changed"
                exit 1
              }
          done
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.3.1" >/dev/null 2>&1; then
            echo "v0.3.1 already exists; immutable tags are not overwritten"
            exit 1
          fi
          test -s release-dist/Pravda-Bot-v0.3.1-Windows-x64.zip
          (cd release-dist && sha256sum --check SHA256SUMS.txt)
      - name: Publish new v0.3.1 Windows prerelease
        shell: bash
        run: |
          gh release create v0.3.1 \
            release-dist/Pravda-Bot-v0.3.1-Windows-x64.zip \
            release-dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Pravda-Bot v0.3.1 — Windows x64" \
            --notes-file docs/releases/v0.3.1.md \
            --prerelease

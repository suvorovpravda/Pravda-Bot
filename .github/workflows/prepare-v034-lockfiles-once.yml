name: Refresh v0.3.4 Cargo locks once
on:
  push:
    branches: [release/prepare-v0.3.4-dashboard]
permissions:
  contents: write
jobs:
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Refresh both Rust workspaces without upgrading dependency versions
        run: |
          cargo fmt --all
          cargo fmt --manifest-path crates/pravda-app/Cargo.toml
          cargo update --workspace
          cargo update --manifest-path crates/pravda-app/Cargo.toml --workspace
      - name: Delete temporary workflow and commit lockfiles
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-v034-lockfiles-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): refresh v0.3.4 Cargo lockfiles"
            git push origin HEAD:release/prepare-v0.3.4-dashboard
          fi

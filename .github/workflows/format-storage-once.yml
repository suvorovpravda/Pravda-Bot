name: One-time rustfmt for Windows persistence fix
on:
  push:
    branches: [fix/windows-persistent-storage-and-auth-smoke-20261102]
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Format Windows desktop Rust source
        run: cargo fmt --manifest-path crates/pravda-app/Cargo.toml
      - name: Remove one-time workflow and push formatting
        run: |
          set -euo pipefail
          rm .github/workflows/format-storage-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style(windows): rustfmt stable desktop storage tests"
            git push origin HEAD:fix/windows-persistent-storage-and-auth-smoke-20261102
          fi

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install -r requirements.txt

      - name: Verify syntax and imports
        run: |
          python -m compileall -q main.py alert_gate.py bot_config.py bot_dashboard.py csv_schema.py market_data_health.py paper_simulator.py analyze_spreads.py analyze_paper_results.py dashboard.py lng_observations.py security_and_fees.py
          python -c "import alert_gate, analyze_spreads, analyze_paper_results, bot_config, bot_dashboard, csv_schema, dashboard, lng_observations, market_data_health, paper_simulator, security_and_fees; print('Imports passed.')"
          python analyze_spreads.py --help

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  security-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install -r requirements.txt

      - name: Audit dependencies with pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit --desc || true

      - name: Verify requirements hashes
        run: |
          echo "Requirements hashes verification skipped - using committed requirements.txt"

      - name: Verify syntax and imports
        run: |
          python -m compileall -q main.py alert_gate.py bot_config.py bot_dashboard.py csv_schema.py market_data_health.py paper_simulator.py analyze_spreads.py analyze_paper_results.py dashboard.py lng_observations.py security_and_fees.py
          python -c "import alert_gate, analyze_spreads, analyze_paper_results, bot_config, bot_dashboard, csv_schema, dashboard, lng_observations, market_data_health, paper_simulator, security_and_fees; print('Imports passed.')"
          python analyze_spreads.py --help

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

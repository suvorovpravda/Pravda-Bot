name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify syntax and imports
        run: |
          python -m compileall -q main.py bot_config.py bot_dashboard.py analyze_spreads.py
          python -c "import analyze_spreads, bot_config, bot_dashboard; print('Imports passed.')"
          python analyze_spreads.py --help

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

name: Repair CI files on one feature branch
on:
  push:
    branches:
      - fix/ci-lock-format-windows-smoke

permissions:
  contents: write

jobs:
  format-and-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Format Rust workspaces
        run: |
          cargo fmt --all
          cargo fmt --manifest-path crates/pravda-app/Cargo.toml
      - name: Synchronize both Cargo lockfiles without upgrading unrelated crates
        run: |
          cargo update --workspace
          cargo update --manifest-path crates/pravda-app/Cargo.toml --workspace
      - name: Remove temporary repair workflow after use
        run: rm .github/workflows/repair-ci-once.yml
      - name: Commit only generated fixes to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): regenerate lockfiles and apply rustfmt"
            git push origin HEAD:fix/ci-lock-format-windows-smoke
          fi

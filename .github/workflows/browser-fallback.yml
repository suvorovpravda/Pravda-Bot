name: Windows browser fallback and password persistence
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows_browser:
    name: Build Rust server and test restart/auth persistence (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Enforce exact checked-out source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Checked-out SHA differs from the required source SHA"
            exit 1
          fi
          echo "Verified source SHA=$actual"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - name: Build native Windows Rust server executable
        run: cargo build --locked --release -p pravda-server
      - name: Stage standalone browser-mode package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force tools/release-stage,release-dist | Out-Null
          Copy-Item target/release/pravda-server.exe tools/release-stage/pravda-server.exe
          foreach ($file in @("Start-Pravda-Bot.ps1", "Stop-Pravda-Bot.ps1", "Demarrer-Pravda-Bot.cmd", "Arreter-Pravda-Bot.cmd", "README-NAVIGATEUR.txt")) {
            Copy-Item (Join-Path tools $file) (Join-Path tools/release-stage $file)
          }
      - name: Test password setup, hashed disk persistence and login after restart
        shell: pwsh
        run: ./tools/test-browser-mode.ps1
      - name: Verify no custom or private local data inside archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(Get-ChildItem tools/release-stage -File | Select-Object -ExpandProperty Name)
          if ($files.Count -ne 6 -or -not ($files -contains "pravda-server.exe")) {
            throw "Unexpected files in browser-mode distribution"
          }
          Compress-Archive -Path tools/release-stage/* -DestinationPath release-dist/Pravda-Bot-Windows-Navigateur.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 release-dist/Pravda-Bot-Windows-Navigateur.zip).Hash.ToLowerInvariant()
          "$hash  Pravda-Bot-Windows-Navigateur.zip" | Set-Content -Encoding ascii release-dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: pravda-bot-windows-browser-fallback
          path: release-dist/*
          retention-days: 14
          if-no-files-found: error

name: Propose dependency lock updates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install pinned tools
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install --require-hashes -r requirements-bootstrap.txt
          .audit-venv/bin/python -m pip install --require-hashes -r requirements-dev.txt
      - name: Generate proposed locks without publishing
        run: |
          for name in requirements requirements-bootstrap requirements-dev requirements-build; do
            .audit-venv/bin/uv pip compile --universal --python-version 3.12 --generate-hashes --no-build "$name.in" -o "$name.txt"
          done
          git diff -- requirements*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: proposed-dependency-locks
          path: requirements*.txt

name: Publish Pravda-Bot v0.3.2 Windows fix once
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v032-once.yml]
permissions:
  contents: write
  actions: read
jobs:
  windows:
    name: Build and verify portable Windows release executable
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 7c0c77869cf11448e22f2b054848277dd189f39a
      - uses: dtolnay/rust-toolchain@stable
      - name: Build 64-bit Windows release
        run: cargo build --locked --release --manifest-path crates/pravda-app/Cargo.toml
      - name: Launch executable and test real WebView2 navigation headers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $probe = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $probe.Start()
          $port = $probe.LocalEndpoint.Port
          $probe.Stop()
          $env:DASHBOARD_PORT = "$port"
          $env:PRAVDA_MARKET_FEEDS_ENABLED = "false"
          $env:PRAVDA_DB_PATH = Join-Path $env:RUNNER_TEMP "pravda-release032.db"
          $env:PRAVDA_AUTH_PATH = Join-Path $env:RUNNER_TEMP "pravda-release032-auth.json"
          $app = Join-Path (Get-Location).Path "crates/pravda-app/target/release/pravda-app.exe"
          if (-not (Test-Path $app)) { throw "Missing compiled Windows exe" }
          $process = Start-Process -FilePath $app -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 80; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) { throw "Release exe exited unexpectedly" }
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/login" -TimeoutSec 2 -MaximumRedirection 0
                if ($r.StatusCode -eq 200 -and $r.Headers["x-pravda-server"] -eq "1") {
                  $ready = $true
                  break
                }
              } catch { }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw "Release exe did not start its authentication server" }
            $headers = @{
              "Sec-Fetch-Site" = "cross-site"
              "Sec-Fetch-Mode" = "navigate"
              "Sec-Fetch-Dest" = "document"
            }
            $doc = Invoke-WebRequest -Uri "http://127.0.0.1:$port/login" -Headers $headers -TimeoutSec 3 -MaximumRedirection 0
            if ($doc.StatusCode -ne 200 -or $doc.Content -notmatch "Pravda-Bot") {
              throw "WebView2 first navigation rejected"
            }
            Write-Host "Release exe starts and serves WebView2 first navigation."
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Package executable, documentation and hash
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force "release-stage","release-dist" | Out-Null
          Copy-Item "crates/pravda-app/target/release/pravda-app.exe" "release-stage/pravda-app.exe"
          Copy-Item "README.md" "release-stage/README.md"
          Copy-Item "SECURITY.md" "release-stage/SECURITY.md"
          Copy-Item "docs/releases/v0.3.2.md" "release-stage/RELEASE_NOTES.md"
          Compress-Archive -Path "release-stage/*" -DestinationPath "release-dist/Pravda-Bot-v0.3.2-Windows-x64.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "release-dist/Pravda-Bot-v0.3.2-Windows-x64.zip").Hash.ToLowerInvariant()
          "$hash  Pravda-Bot-v0.3.2-Windows-x64.zip" | Set-Content -Encoding ascii "release-dist/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pravda-bot-v0.3.2-windows
          path: release-dist/*
          if-no-files-found: error

  publish:
    name: Publish immutable v0.3.2 only from security-checked Rust source
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 7c0c77869cf11448e22f2b054848277dd189f39a
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 7c0c77869cf11448e22f2b054848277dd189f39a
      - uses: actions/download-artifact@v4
        with:
          name: pravda-bot-v0.3.2-windows
          path: release-dist
      - name: Guard source, CI results and release integrity
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          changed="$(gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...$current" --jq '.files[].filename')"
          test "$changed" = ".github/workflows/publish-v032-once.yml" || {
            echo "Unexpected source changes on main: publication blocked"
            exit 1
          }
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=50")"
          echo "$runs" | jq -e --arg sha "$SOURCE_SHA" '
            [.workflow_runs[] | select(.head_sha == $sha and .event == "push")] as $r
            | (any($r[]; .name == "Rust migration" and .conclusion == "success"))
              and (any($r[]; .name == "CodeQL Advanced" and .conclusion == "success"))
          ' >/dev/null || { echo "Required main Rust and CodeQL checks are incomplete"; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.3.2" >/dev/null 2>&1; then
            echo "Immutable release tag already exists; refusing overwrite"
            exit 1
          fi
          test -s release-dist/Pravda-Bot-v0.3.2-Windows-x64.zip
          (cd release-dist && sha256sum -c SHA256SUMS.txt)
      - name: Publish v0.3.2 Windows prerelease
        shell: bash
        run: |
          gh release create v0.3.2 \
            release-dist/Pravda-Bot-v0.3.2-Windows-x64.zip \
            release-dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Pravda-Bot v0.3.2 — Windows origin fix" \
            --notes-file docs/releases/v0.3.2.md \
            --prerelease

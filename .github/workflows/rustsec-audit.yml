name: RustSec dependency audit (blocking)

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'crates/pravda-app/Cargo.lock'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - '.cargo/audit.toml'
      - '.github/workflows/rustsec-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'crates/pravda-app/Cargo.lock'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - '.cargo/audit.toml'
      - '.github/workflows/rustsec-audit.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: RustSec / ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: core
            lockfile: Cargo.lock
          - component: desktop
            lockfile: crates/pravda-app/Cargo.lock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Enforce exact checked-out source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Checked-out SHA differs from the required source SHA"
            exit 1
          fi
          echo "Verified source SHA=$actual"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - name: Cache pinned audit tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-0.22.2
      - name: Install pinned cargo-audit
        shell: bash
        run: |
          set -euo pipefail
          # cargo-audit's Cargo subcommand prints a prefixed name such as
          # "cargo-audit-audit 0.22.2"; compare the pinned version suffix.
          installed_version="$(cargo audit --version 2>/dev/null || true)"
          if ! command -v cargo-audit >/dev/null 2>&1 || [[ "$installed_version" != *' 0.22.2' ]]; then
            cargo install cargo-audit --version 0.22.2 --locked --force
          fi
          cargo audit --version
      - name: Audit ${{ matrix.component }} locked dependencies (blocking)
        shell: bash
        env:
          LOCKFILE: ${{ matrix.lockfile }}
        run: |
          set -euo pipefail
          test -f "$LOCKFILE"
          cargo audit --file "$LOCKFILE" --format sarif > rustsec.sarif
          echo "RustSec ${LOCKFILE}: all advisories accepted by cargo-audit" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve SARIF findings even on blocking failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: rustsec-${{ matrix.component }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: rustsec.sarif
          if-no-files-found: warn
          retention-days: 30


  regenerate_desktop_lock:
    name: Generate desktop lockfile candidate with Cargo
    # Do not commit, push, or modify main; this is a reviewable artifact only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Enforce exact checked-out source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Checked-out SHA differs from the required source SHA"
            exit 1
          fi
          echo "Verified source SHA=$actual"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - name: Regenerate desktop lockfile using Cargo resolver
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path crates/pravda-app/Cargo.toml --format-version 1 >/dev/null
          git diff --check
          test -s crates/pravda-app/Cargo.lock
          git diff -- crates/pravda-app/Cargo.lock > desktop-lock-cargo.patch
          if test ! -s desktop-lock-cargo.patch; then
            echo 'Desktop lockfile unchanged after Cargo metadata'
          fi
      - name: Preserve Cargo-generated lock and review diff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: desktop-lock-cargo-${{ github.event.pull_request.head.sha }}
          path: |
            crates/pravda-app/Cargo.lock
            desktop-lock-cargo.patch
          if-no-files-found: error
          retention-days: 7

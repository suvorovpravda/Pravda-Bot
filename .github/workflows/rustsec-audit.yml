name: RustSec dependency audit (observe only)

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - '.cargo/audit.toml'
      - '.github/workflows/rustsec-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - '.cargo/audit.toml'
      - '.github/workflows/rustsec-audit.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: RustSec advisory scan (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache pinned audit tool
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-0.22.2
      - name: Install pinned cargo-audit
        shell: bash
        run: |
          set -euo pipefail
          # cargo-audit's Cargo subcommand prints a prefixed name such as
          # "cargo-audit-audit 0.22.2"; compare the pinned version suffix.
          installed_version="$(cargo audit --version 2>/dev/null || true)"
          if ! command -v cargo-audit >/dev/null 2>&1 || [[ "$installed_version" != *' 0.22.2' ]]; then
            cargo install cargo-audit --version 0.22.2 --locked --force
          fi
          cargo audit --version
      - name: Audit locked Rust dependencies
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo audit --file Cargo.lock --format sarif > rustsec.sarif
      - name: Explain audit outcome
        if: always()
        shell: bash
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          {
            echo '### RustSec Cargo.lock audit — observation phase'
            if [ "$AUDIT_OUTCOME" = 'success' ]; then
              echo 'The RustSec audit exited successfully; inspect the SARIF artifact for details.'
            elif [ "$AUDIT_OUTCOME" = 'failure' ]; then
              echo 'The audit returned a nonzero exit code. This may indicate an advisory or an execution/database failure: inspect the job logs and SARIF artifact.'
              echo '::warning::RustSec audit returned a nonzero status; review advisories or tool/database failures before release.'
            else
              echo 'The audit did not complete. No claim of a clean dependency set is permitted.'
              echo '::warning::RustSec audit was not completed.'
            fi
            echo 'This check is advisory during the rollout; it does not validate signed Windows packages or the physical offline VM acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve SARIF findings for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rustsec-dependency-scan-${{ github.sha }}
          path: rustsec.sarif
          if-no-files-found: warn
          retention-days: 30

name: SonarCloud main diagnostic
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Verify complete SonarCloud issue pagination (offline fixtures)
        run: node tools/test-sonar-main-diagnostics.mjs
      - name: Query public main branch SonarCloud diagnostics
        run: node tools/sonar-main-diagnostics.mjs

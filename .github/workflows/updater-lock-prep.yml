name: Prepare updater dependency lock
on:
  push:
    branches: [feat/tauri-updater-runtime-20261106]
permissions:
  contents: read
concurrency:
  group: updater-lock-prep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  resolve:
    name: Resolve temporary desktop lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Generate lock for pinned optional updater dependency
        run: cargo metadata --manifest-path crates/pravda-app/Cargo.toml --format-version 1 > /dev/null
      - name: Format desktop sources
        run: cargo fmt --manifest-path crates/pravda-app/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: pravda-updater-desktop-lockfile
          path: |
            crates/pravda-app/Cargo.lock
            crates/pravda-app/src/main.rs
            crates/pravda-app/src/updater_runtime.rs
          if-no-files-found: error
          retention-days: 1
  windows_test:
    name: Compile dormant updater and test configuration
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          name: pravda-updater-desktop-lockfile
          path: crates/pravda-app
      - name: Test optional updater configuration with locked dependencies
        run: cargo test --locked --manifest-path crates/pravda-app/Cargo.toml --features signed-updater-runtime updater_runtime::tests

name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '39 12 * * 4'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript]
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false

    - name: Enforce exact checked-out source SHA
      shell: bash
      env:
        EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        actual="$(git rev-parse HEAD)"
        if [ "$actual" != "$EXPECTED_SOURCE_SHA" ]; then
          echo "::error::Checked-out SHA differs from the required source SHA"
          exit 1
        fi
        echo "Verified source SHA=$actual"
    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        config-file: ./.github/codeql-config.yml
        queries: security-extended,security-and-quality

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4
      with:
        category: "/language:${{ matrix.language }}"

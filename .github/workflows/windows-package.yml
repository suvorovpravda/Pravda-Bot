name: Windows installer packaging (manual; optional Authenticode)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-package.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'rust/**'
      - 'tools/Verify-Pravda-Installer.ps1'
      - 'tools/test-windows-installer-verifier.ps1'
      - 'tools/Test-Pravda-Msi-Install.ps1'
      - 'tools/Test-Pravda-Nsis-Install.ps1'
      - 'tools/test-installed-onboarding.mjs'
      - 'tools/Test-Pravda-Airgap-Install.ps1'
      - 'tools/Initialize-Pravda-Airgap-Gui.ps1'
      - 'tools/test-airgap-acceptance-contract.mjs'
      - 'tools/prepare-updater-release.mjs'
      - 'tools/verify-updater-signature.mjs'
      - 'tools/test-updater-release.mjs'
      - 'tools/test-tauri-signer-integration.mjs'
  pull_request:
    paths:
      - '.github/workflows/windows-package.yml'
      - 'crates/**'
      - 'rust/**'
      - 'crates/pravda-app/tauri.conf.json'
      - 'tools/Verify-Pravda-Installer.ps1'
      - 'tools/test-windows-installer-verifier.ps1'
      - 'tools/Test-Pravda-Msi-Install.ps1'
      - 'tools/Test-Pravda-Nsis-Install.ps1'
      - 'tools/test-installed-onboarding.mjs'
      - 'tools/Test-Pravda-Airgap-Install.ps1'
      - 'tools/Initialize-Pravda-Airgap-Gui.ps1'
      - 'tools/test-airgap-acceptance-contract.mjs'
      - 'tools/prepare-updater-release.mjs'
      - 'tools/verify-updater-signature.mjs'
      - 'tools/test-updater-release.mjs'
      - 'tools/test-tauri-signer-integration.mjs'
  workflow_dispatch:
    inputs:
      signed:
        description: 'Require valid Authenticode signatures on EXE, NSIS and MSI'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Build Windows NSIS and MSI candidates
    runs-on: windows-latest
    environment: ${{ inputs.signed && 'windows-signing' || 'unsigned-test' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Parse Windows installer scripts before expensive builds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('tools/Test-Pravda-Msi-Install.ps1', 'tools/Test-Pravda-Nsis-Install.ps1', 'tools/Test-Pravda-Airgap-Install.ps1', 'tools/Initialize-Pravda-Airgap-Gui.ps1', 'tools/Verify-Pravda-Installer.ps1', 'tools/test-windows-installer-verifier.ps1')) {
            $tokens = $null
            $errors = $null
            $resolved = (Resolve-Path -LiteralPath $path -ErrorAction Stop).Path
            [System.Management.Automation.Language.Parser]::ParseFile($resolved, [ref]$tokens, [ref]$errors) | Out-Null
            if (@($errors).Count -gt 0) {
              throw "PowerShell syntax invalid in $path"
            }
            Write-Host "PASS PowerShell parse $path"
          }
      - name: Verify airgap QA refuses regular Windows invocation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            & ./tools/Test-Pravda-Airgap-Install.ps1 -InstallerPath 'NO_INSTALLER.msi' -Kind MSI -ExpectedSha256 ('0' * 64) -ExpectedCommitSha ('0' * 40)
            throw 'FAIL: airgap test accepted an unacknowledged host'
          } catch {
            if ($_.Exception.Message -notmatch '^REFUSED: disposable-VM acknowledgement required') {
              throw
            }
            Write-Host 'PASS: airgap acceptance cannot run without explicit disposable VM acknowledgement'
          }
      - name: Verify protected Enterprise signing prerequisites
        if: ${{ inputs.signed }}
        shell: pwsh
        env:
          CERT_AVAILABLE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
          PASSWORD_AVAILABLE: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CERT_AVAILABLE -ne 'true' -or $env:PASSWORD_AVAILABLE -ne 'true') {
            throw 'Enterprise signing secrets missing (fail closed)'
          }
          if ($env:RELEASE_REF -ne 'refs/heads/main' -and
              $env:RELEASE_REF -notmatch '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?$') {
            throw 'Enterprise signing requires main or versioned tag'
          }
      - name: Require Tauri signer for tagged Windows updater candidates
        if: ${{ inputs.signed && startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          UPDATER_KEY_CONFIGURED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          UPDATER_PUBLIC_KEY_CONFIGURED: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY != '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:UPDATER_KEY_CONFIGURED -ne 'true' -or $env:UPDATER_PUBLIC_KEY_CONFIGURED -ne 'true') {
            throw 'Protected Tauri updater signing and verification keys are required for tagged candidates'
          }
          $currentVersion = (Get-Content 'crates/pravda-app/tauri.conf.json' -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -cne ("refs/tags/v" + $currentVersion)) {
            throw 'Tagged updater candidate must use the exact desktop stable version'
          }
      - name: Verify root and Tauri locks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo metadata --locked --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Root Cargo.lock is stale' }
          cargo metadata --locked --manifest-path crates/pravda-app/Cargo.toml --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Desktop Cargo.lock is stale' }
      - name: Install Tauri 2 CLI
        shell: pwsh
        run: |
          cargo install tauri-cli --version '=2.12.4' --locked
          if ($LASTEXITCODE -ne 0) { throw 'Tauri CLI install failed' }
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test updater signature verification with the official Tauri signer
        run: node tools/test-tauri-signer-integration.mjs
      - name: Import code-signing certificate (explicit manual opt-in)
        if: ${{ inputs.signed }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference='Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'Code-signing secrets missing from windows-signing environment'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'pravda-temporary-code-sign.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $cert -or -not $cert.HasPrivateKey -or $cert.NotAfter -le (Get-Date)) {
              throw 'Valid non-expired code signing certificate with private key required'
            }
            $eku = @($cert.EnhancedKeyUsageList | ForEach-Object { $_.ObjectId.Value })
            if ($eku -notcontains '1.3.6.1.5.5.7.3.3') {
              throw 'Certificate does not allow code signing'
            }
            "PRAVDA_SIGNING_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
            Remove-Item Env:WINDOWS_CERTIFICATE_BASE64 -ErrorAction SilentlyContinue
            Remove-Item Env:WINDOWS_CERTIFICATE_PASSWORD -ErrorAction SilentlyContinue
          }
      - name: Configure Tauri code signing before building EXE and installers
        if: ${{ inputs.signed }}
        shell: pwsh
        working-directory: crates/pravda-app
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference='Stop'
          if ($env:PRAVDA_SIGNING_THUMBPRINT -notmatch '^[0-9A-Fa-f]{40}$') {
            throw 'Signing certificate thumbprint was not validated'
          }
          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $env:PRAVDA_SIGNING_THUMBPRINT
                digestAlgorithm = 'sha256'
                timestampUrl = 'http://timestamp.digicert.com'
              }
            }
          }
          if ($env:GITHUB_REF -match '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$') {
            # Tauri CLI requires an updater pubkey to sign update artifacts.
            # This CI-only config does not install a runtime updater plugin.
            if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY) -or
                $env:TAURI_UPDATER_PUBLIC_KEY.Trim().Length -lt 40) {
              throw 'A real Tauri updater public verification key is required'
            }
            $config.bundle.createUpdaterArtifacts = $true
            $config.plugins = @{
              updater = @{
                pubkey = $env:TAURI_UPDATER_PUBLIC_KEY.Trim()
                endpoints = @('https://github.com/suvorovpravda/Pravda-Bot/releases/latest/download/latest.json')
                requireSignedVersion = $true
                allowDowngrades = $false
                dangerousInsecureTransportProtocol = $false
              }
            }
          }
          $config | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath 'tauri.signing.ci.json' -Encoding utf8
      - name: Build NSIS and MSI with locked Cargo dependencies
        shell: pwsh
        working-directory: crates/pravda-app
        env:
          PRAVDA_SIGNED: ${{ inputs.signed }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference='Stop'
          if ($env:PRAVDA_SIGNED -eq 'true') {
            cargo tauri build --ci --config tauri.signing.ci.json --bundles nsis,msi -- --locked
          } else {
            cargo tauri build --ci --bundles nsis,msi -- --locked
          }
          if ($LASTEXITCODE -ne 0) { throw 'Tauri Windows package build failed' }
      - name: Prove release desktop PE uses GUI subsystem (no terminal lifetime)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'crates/pravda-app/target/release/pravda-app.exe').Path
          $handle = [IO.File]::OpenRead($exe)
          try {
            $reader = [IO.BinaryReader]::new($handle)
            if ($reader.ReadUInt16() -ne 0x5A4D) { throw 'Desktop is not a Windows MZ executable' }
            $handle.Position = 0x3C
            $peOffset = $reader.ReadInt32()
            if ($peOffset -lt 0x40 -or $peOffset -gt $handle.Length - 96) {
              throw 'Desktop PE header offset is invalid'
            }
            $handle.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x00004550) { throw 'Desktop PE signature is invalid' }
            # Subsystem is at offset 68 within the PE optional header.
            # 2 = IMAGE_SUBSYSTEM_WINDOWS_GUI, 3 = console application.
            $handle.Position = $peOffset + 24 + 68
            $subsystem = $reader.ReadUInt16()
            if ($subsystem -ne 2) {
              throw "Desktop has a console subsystem ($subsystem); would bind Windows Terminal to the GUI lifetime"
            }
            Write-Host 'PASS: installed Tauri desktop uses IMAGE_SUBSYSTEM_WINDOWS_GUI (2)'
          } finally { $handle.Dispose() }
      - name: Build and stage Rust Doctor and offline Harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked --release -p pravda-server --bin pravda-doctor --bin pravda-harness
          if ($LASTEXITCODE -ne 0) { throw 'Rust companions build failed' }
          foreach ($name in @('pravda-doctor.exe', 'pravda-harness.exe')) {
            $source = Get-Item -LiteralPath (Join-Path 'target/release' $name) -ErrorAction Stop
            if ($source.Length -lt 100000) { throw 'Invalid Rust companion binary' }
            Copy-Item -LiteralPath $source.FullName -Destination (Join-Path 'crates/pravda-app/target/release' $name) -Force
          }
      - name: Sign standalone companions with Authenticode
        if: ${{ inputs.signed }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $thumbprint = $env:PRAVDA_SIGNING_THUMBPRINT
          if ($thumbprint -notmatch '^[0-9A-Fa-f]{40}$') { throw 'Signing identity missing' }
          $kit = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $tools = @(Get-ChildItem -LiteralPath $kit -Recurse -File -Filter signtool.exe -ErrorAction Stop |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]signtool.exe$' } |
            Sort-Object FullName -Descending)
          if ($tools.Count -eq 0) { throw 'Windows SDK x64 signtool missing' }
          foreach ($name in @('pravda-doctor.exe', 'pravda-harness.exe')) {
            $file = Join-Path 'crates/pravda-app/target/release' $name
            & ($tools[0].FullName) sign /sha1 $thumbprint /fd sha256 /tr http://timestamp.digicert.com /td sha256 $file
            if ($LASTEXITCODE -ne 0) { throw 'Companion signing failed' }
          }
      - name: Build single-click Windows production test center with embedded payloads
        shell: pwsh
        env:
          PRAVDA_BUILD_COMMIT: ${{ github.sha }}
          PRAVDA_TEST_CENTER_REQUIRE_PAYLOADS: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PRAVDA_TEST_CENTER_PAYLOAD_DIR = (Resolve-Path 'crates/pravda-app/target/release').Path
          cargo build --locked --release -p pravda-server --bin pravda-test-center
          if ($LASTEXITCODE -ne 0) { throw 'Native single-click production test center compilation failed' }
          $exe = Get-Item -LiteralPath 'target/release/pravda-test-center.exe' -ErrorAction Stop
          if ($exe.Length -lt 1000000) { throw 'Single-click test center did not embed the release payloads' }
          Copy-Item -LiteralPath $exe.FullName -Destination 'crates/pravda-app/target/release/pravda-test-center.exe' -Force
      - name: Verify continuous offline diagnostic agent in a single bounded cycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PRAVDA_TEST_CENTER_REPORT_DIR = Join-Path $env:RUNNER_TEMP ('pravda-agent-ci-' + [guid]::NewGuid().ToString('N'))
          $env:PRAVDA_API_TOKEN = 'DO_NOT_LEAK_MONITOR_SENTINEL'
          New-Item -ItemType Directory -Force -Path $env:PRAVDA_TEST_CENTER_REPORT_DIR | Out-Null
          $exe = (Resolve-Path 'target/release/pravda-test-center.exe').Path
          $job = Start-Process -FilePath $exe -ArgumentList '--monitor-once' -Wait -PassThru
          if ($job.ExitCode -ne 0) { throw 'Offline diagnostic agent first cycle failed' }
          $reportPath = Join-Path $env:PRAVDA_TEST_CENTER_REPORT_DIR 'PRAVDA-COPIER-ICI.txt'
          $jsonPath = Join-Path $env:PRAVDA_TEST_CENTER_REPORT_DIR 'PRAVDA-DERNIERS-TESTS.json'
          $htmlPath = Join-Path $env:PRAVDA_TEST_CENTER_REPORT_DIR 'PRAVDA-RESULTATS.html'
          $statusPath = Join-Path $env:PRAVDA_TEST_CENTER_REPORT_DIR 'PRAVDA-ETAT.txt'
          foreach ($path in @($reportPath, $jsonPath, $htmlPath, $statusPath)) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Monitor output missing: $([IO.Path]::GetFileName($path))" }
          }
          $body = Get-Content -LiteralPath $reportPath -Raw
          if ($body.Contains($env:PRAVDA_API_TOKEN)) { throw 'Monitor report disclosed environment credential' }
          $report = $body | ConvertFrom-Json
          if ($report.product -ne 'Pravda-Bot' -or $report.signed_release -ne $false) {
            throw 'Monitor report has an unexpected product or signature claim'
          }
          foreach ($name in @('doctor_startup', 'harness_smoke', 'desktop_process', 'synthetic_sqlite_health')) {
            $entry = @($report.findings | Where-Object { $_.check -eq $name })
            if ($entry.Count -ne 1 -or $entry[0].status -ne 'PASS') {
              throw "Monitor missing required offline test: $name"
            }
          }
          if ($body -ne (Get-Content -LiteralPath $jsonPath -Raw)) {
            throw 'Copy-paste and machine-readable monitor reports differ'
          }
          Write-Host 'PASS: single-cycle background agent report, privacy, synthetic tests and stable copyable output'
      - name: Sign embedded one-click test center with Authenticode
        if: ${{ inputs.signed }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $thumbprint = $env:PRAVDA_SIGNING_THUMBPRINT
          if ($thumbprint -notmatch '^[0-9A-Fa-f]{40}$') { throw 'Signing identity missing' }
          $kit = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $tools = @(Get-ChildItem -LiteralPath $kit -Recurse -File -Filter signtool.exe -ErrorAction Stop |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]signtool.exe$' } |
            Sort-Object FullName -Descending)
          if ($tools.Count -eq 0) { throw 'Windows SDK x64 signtool missing' }
          $file = 'crates/pravda-app/target/release/pravda-test-center.exe'
          & ($tools[0].FullName) sign /sha1 $thumbprint /fd sha256 /tr http://timestamp.digicert.com /td sha256 $file
          if ($LASTEXITCODE -ne 0) { throw 'Integrated test center signing failed' }
      - name: Build one-file Windows installer with embedded offline MSI
        shell: pwsh
        env:
          PRAVDA_SETUP_REQUIRE_PAYLOADS: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = @(Get-ChildItem 'crates/pravda-app/target/release/bundle/msi' -Filter '*.msi' -File)
          if ($msi.Count -ne 1) { throw 'Unified setup requires exactly one MSI candidate' }
          $folder = Join-Path $env:RUNNER_TEMP 'pravda-unified-input'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Copy-Item -LiteralPath $msi[0].FullName -Destination (Join-Path $folder 'pravda-installer.msi') -ErrorAction Stop
          $env:PRAVDA_SETUP_PAYLOAD_DIR = $folder
          cargo build --locked --release -p pravda-server --bin pravda-setup
          if ($LASTEXITCODE -ne 0) { throw 'Unified Windows setup compilation failed' }
          $setup = Get-Item 'target/release/pravda-setup.exe' -ErrorAction Stop
          if ($setup.Length -le $msi[0].Length) { throw 'Unified setup does not embed the MSI payload' }
          Copy-Item -LiteralPath $setup.FullName -Destination 'crates/pravda-app/target/release/pravda-setup.exe' -Force
          $process = Start-Process -FilePath 'crates/pravda-app/target/release/pravda-setup.exe' -ArgumentList '--verify-only' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Unified setup payload verification failed' }
      - name: Sign unified setup when Enterprise signing was requested
        if: ${{ inputs.signed }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $thumbprint = $env:PRAVDA_SIGNING_THUMBPRINT
          if ($thumbprint -notmatch '^[0-9A-Fa-f]{40}$') { throw 'Signing identity missing' }
          $kit = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $tools = @(Get-ChildItem -LiteralPath $kit -Recurse -File -Filter signtool.exe -ErrorAction Stop |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]signtool.exe$' } |
            Sort-Object FullName -Descending)
          if ($tools.Count -eq 0) { throw 'Windows SDK x64 signtool missing' }
          $file = 'crates/pravda-app/target/release/pravda-setup.exe'
          & ($tools[0].FullName) sign /sha1 $thumbprint /fd sha256 /tr http://timestamp.digicert.com /td sha256 $file
          if ($LASTEXITCODE -ne 0) { throw 'Unified setup Authenticode signing failed' }
      - name: Verify EXE/MSI/NSIS and fail closed when signing was requested
        shell: pwsh
        env:
          PRAVDA_SIGNED: ${{ inputs.signed }}
        run: |
          $ErrorActionPreference='Stop'
          $dir='crates/pravda-app/target/release/bundle'
          $msi=@(Get-ChildItem "$dir/msi" -Filter '*.msi' -File -ErrorAction SilentlyContinue)
          $nsis=@(Get-ChildItem "$dir/nsis" -Filter '*-setup.exe' -File -ErrorAction SilentlyContinue)
          $exe=Get-Item -LiteralPath 'crates/pravda-app/target/release/pravda-app.exe' -ErrorAction Stop
          $doctor=Get-Item -LiteralPath 'crates/pravda-app/target/release/pravda-doctor.exe' -ErrorAction Stop
          $harness=Get-Item -LiteralPath 'crates/pravda-app/target/release/pravda-harness.exe' -ErrorAction Stop
          $center=Get-Item -LiteralPath 'crates/pravda-app/target/release/pravda-test-center.exe' -ErrorAction Stop
          $setup=Get-Item -LiteralPath 'crates/pravda-app/target/release/pravda-setup.exe' -ErrorAction Stop
          if ($msi.Count -lt 1 -or $nsis.Count -lt 1) { throw 'MSI or NSIS installer missing' }
          foreach ($file in @($exe)+@($doctor)+@($harness)+@($center)+@($setup)+@($msi)+@($nsis)) {
            $hash=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "$($file.Name) SHA256=$hash"
            $sig=Get-AuthenticodeSignature -FilePath $file.FullName
            if ($env:PRAVDA_SIGNED -eq 'true') {
              if ($sig.Status -ne 'Valid' -or
                  $sig.SignerCertificate.Thumbprint -ne $env:PRAVDA_SIGNING_THUMBPRINT -or
                  -not $sig.TimeStamperCertificate) {
                throw "Signature, certificate or timestamp missing/invalid for $($file.Name)"
              }
            } elseif ($sig.Status -ne 'Valid') {
              Write-Warning "UNSIGNED TEST PACKAGE ONLY: $($file.Name). Not an Enterprise release."
            }
          }
      - name: Generate SHA-256 release candidate manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'crates/pravda-app/target/release/bundle'
          $exe = Get-Item 'crates/pravda-app/target/release/pravda-app.exe' -ErrorAction Stop
          $doctor = Get-Item 'crates/pravda-app/target/release/pravda-doctor.exe' -ErrorAction Stop
          $harness = Get-Item 'crates/pravda-app/target/release/pravda-harness.exe' -ErrorAction Stop
          $center = Get-Item 'crates/pravda-app/target/release/pravda-test-center.exe' -ErrorAction Stop
          $setup = Get-Item 'crates/pravda-app/target/release/pravda-setup.exe' -ErrorAction Stop
          $msi = @(Get-ChildItem "$bundle/msi" -Filter '*.msi' -File -ErrorAction Stop)
          $nsis = @(Get-ChildItem "$bundle/nsis" -Filter '*-setup.exe' -File -ErrorAction Stop)
          if ($msi.Count -eq 0 -or $nsis.Count -eq 0) { throw 'Installers missing; cannot produce manifest' }
          $files = @($exe) + @($doctor) + @($harness) + @($center) + @($setup) + $msi + $nsis
          $releaseRoot = (Resolve-Path 'crates/pravda-app/target/release').Path
          $manifest = foreach ($file in ($files | Sort-Object FullName)) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            # Artifact upload strips the common release/ prefix. Hash paths must
            # therefore be relative to that directory, not the repository root.
            $relative = [IO.Path]::GetRelativePath($releaseRoot, $file.FullName).Replace([char]92, '/')
            "$hash  $relative"
          }
          $manifest | Set-Content -LiteralPath "$bundle/SHA256SUMS.txt" -Encoding ascii
          if ((Get-Content "$bundle/SHA256SUMS.txt").Count -ne $files.Count) {
            throw 'Incomplete release candidate manifest'
          }
      - name: Verify portable manifest and Authenticode before upload
        shell: pwsh
        env:
          PRAVDA_SIGNED: ${{ inputs.signed }}
        run: |
          $ErrorActionPreference = 'Stop'
          $verifyArgs = @{
            ReleaseRoot = 'crates/pravda-app/target/release'
            RequireCompanions = $true
          }
          if ($env:PRAVDA_SIGNED -eq 'true') {
            $verifyArgs.RequireSigned = $true
            $verifyArgs.ExpectedThumbprint = $env:PRAVDA_SIGNING_THUMBPRINT
          }
          & ./tools/Verify-Pravda-Installer.ps1 @verifyArgs
      - name: Prepare SHA-bound Tauri signed updater metadata candidate
        if: ${{ inputs.signed && startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'crates/pravda-app/target/release/bundle'
          $msi = @(Get-ChildItem -LiteralPath (Join-Path $bundle 'msi') -Filter '*.msi' -File -ErrorAction Stop)
          if ($msi.Count -ne 1) { throw 'Exactly one signed Windows x64 MSI required for updater metadata' }
          $signature = $msi[0].FullName + '.sig'
          if (-not (Test-Path -LiteralPath $signature -PathType Leaf)) {
            throw 'Tauri updater signature missing from signed release candidate'
          }
          $signingConfig = Get-Content 'crates/pravda-app/tauri.signing.ci.json' -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY) -or
              $signingConfig.plugins.updater.pubkey -cne $env:TAURI_UPDATER_PUBLIC_KEY.Trim()) {
            throw 'Verification key does not match the signed build configuration'
          }
          $version = (Get-Content 'crates/pravda-app/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $hash = (Get-FileHash -LiteralPath $msi[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          node tools/prepare-updater-release.mjs --version $version --tag $env:GITHUB_REF_NAME --commit $env:RELEASE_COMMIT_SHA --installer $msi[0].FullName --signature $signature --sha256 $hash --output-dir $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Updater metadata candidate validation failed' }
      - name: Archive signed updater metadata candidate (not published as a release)
        if: ${{ inputs.signed && startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: pravda-signed-updater-metadata-candidate
          path: |
            crates/pravda-app/target/release/bundle/latest.json
            crates/pravda-app/target/release/bundle/latest.provenance.json
            crates/pravda-app/target/release/bundle/msi/*.msi.sig
          if-no-files-found: error
          retention-days: 30
      - name: Produce commit-bound SHA-256 and Authenticode evidence
        shell: pwsh
        env:
          SIGNED: ${{ inputs.signed }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path 'crates/pravda-app/target/release').Path
          $results = @()
          foreach ($line in @(Get-Content -LiteralPath (Join-Path $root 'bundle/SHA256SUMS.txt') -Encoding ascii)) {
            if ($line -cnotmatch '^([0-9a-f]{64})  (.+)$') { throw 'Invalid checksum entry' }
            $hash = $Matches[1]
            $relative = $Matches[2]
            $file = Get-Item -LiteralPath (Join-Path $root $relative) -ErrorAction Stop
            $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
            $ok = $sig.Status -eq 'Valid' -and $null -ne $sig.SignerCertificate -and $null -ne $sig.TimeStamperCertificate
            if ($env:SIGNED -eq 'true' -and (-not $ok -or $sig.SignerCertificate.Thumbprint -ne $env:PRAVDA_SIGNING_THUMBPRINT)) {
              throw 'Enterprise artifact signature invalid'
            }
            $results += @{
              path = $relative
              sha256 = $hash
              authenticode_status = [string]$sig.Status
              authenticode_valid = [bool]$ok
              signer_thumbprint = if ($sig.SignerCertificate) { $sig.SignerCertificate.Thumbprint } else { $null }
              timestamped = [bool]($null -ne $sig.TimeStamperCertificate)
              timestamp_authority_thumbprint = if ($sig.TimeStamperCertificate) { $sig.TimeStamperCertificate.Thumbprint } else { $null }
            }
          }
          $evidence = @{ schema_version=1; commit_sha=$env:RELEASE_COMMIT; git_ref=$env:RELEASE_REF;
            signed_release=($env:SIGNED -eq 'true'); generated_utc=(Get-Date).ToUniversalTime().ToString('o'); artifacts=$results }
          $evidence | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $root 'bundle/release-evidence.json') -Encoding utf8
      - name: Remove imported code-signing certificate from runner
        if: ${{ always() && inputs.signed }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Remove only the signing identity imported for this job.
          if ($env:PRAVDA_SIGNING_THUMBPRINT -notmatch '^[0-9A-Fa-f]{40}$') {
            throw 'Signing certificate thumbprint unavailable for cleanup'
          }
          $path = "Cert:\CurrentUser\My\$($env:PRAVDA_SIGNING_THUMBPRINT)"
          if (Test-Path -LiteralPath $path) {
            Remove-Item -LiteralPath $path -Force -ErrorAction Stop
          }
          if (Test-Path -LiteralPath $path) {
            throw 'Imported code-signing certificate still present after cleanup'
          }
      - name: Clean up temporary signing config
        if: always()
        shell: pwsh
        run: |
          Remove-Item 'crates/pravda-app/tauri.signing.ci.json' -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v7
        with:
          name: pravda-windows-${{ inputs.signed && 'signed' || 'unsigned' }}-candidate-installers
          path: |
            crates/pravda-app/target/release/bundle/msi/*.msi
            crates/pravda-app/target/release/bundle/nsis/*-setup.exe
            crates/pravda-app/target/release/bundle/SHA256SUMS.txt
            crates/pravda-app/target/release/bundle/release-evidence.json
            crates/pravda-app/target/release/pravda-doctor.exe
            crates/pravda-app/target/release/pravda-harness.exe
            crates/pravda-app/target/release/pravda-test-center.exe
            crates/pravda-app/target/release/pravda-setup.exe
            crates/pravda-app/target/release/pravda-app.exe
          if-no-files-found: error
          retention-days: 30

      # The only operator download; forensic builds remain separate.
      - name: Publish single-file Windows setup
        uses: actions/upload-artifact@v7
        with:
          name: pravda-windows-single-file-setup
          path: crates/pravda-app/target/release/pravda-setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Stage independent companion download folders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'companion-dist/test', 'companion-dist/doctor' | Out-Null
          Copy-Item -LiteralPath 'crates/pravda-app/target/release/pravda-harness.exe' -Destination 'companion-dist/test/pravda-harness.exe' -ErrorAction Stop
          Copy-Item -LiteralPath 'docs/windows/PRODUCTION-TEST.txt' -Destination 'companion-dist/test/PRODUCTION-TEST.txt' -ErrorAction Stop
          Copy-Item -LiteralPath 'crates/pravda-app/target/release/pravda-doctor.exe' -Destination 'companion-dist/doctor/pravda-doctor.exe' -ErrorAction Stop
          Copy-Item -LiteralPath 'docs/windows/TROUBLESHOOTING.txt' -Destination 'companion-dist/doctor/TROUBLESHOOTING.txt' -ErrorAction Stop
      - name: Publish one-click production acceptance center
        uses: actions/upload-artifact@v7
        with:
          name: pravda-windows-one-click-test-center
          path: crates/pravda-app/target/release/pravda-test-center.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish standalone preproduction test tool
        uses: actions/upload-artifact@v7
        with:
          name: pravda-windows-production-test
          path: |
            companion-dist/test/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish standalone troubleshooting tool
        uses: actions/upload-artifact@v7
        with:
          name: pravda-windows-troubleshooting
          path: |
            companion-dist/doctor/*
          if-no-files-found: error
          retention-days: 30

  verify-upload:
    name: Verify downloaded release bundle on an independent Windows runner
    needs: package
    # WebView2/EdgeDriver native E2E is validated on windows-2022.
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: pravda-windows-${{ inputs.signed && 'signed' || 'unsigned' }}-candidate-installers
          path: downloaded-release
      - name: Validate extracted EXE, MSI, NSIS, Doctor, Harness and provenance
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_SIGNED: ${{ inputs.signed || false }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path 'downloaded-release').Path
          $evidencePath = Join-Path $root 'bundle/release-evidence.json'
          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          $expectedSigned = $env:EXPECTED_SIGNED -eq 'true'
          if ($evidence.schema_version -ne 1 -or
              $evidence.commit_sha -cne $env:EXPECTED_COMMIT -or
              [bool]$evidence.signed_release -ne $expectedSigned) {
            throw 'Downloaded artifact provenance, commit or signed mode mismatch'
          }
          $entries = @(Get-Content -LiteralPath (Join-Path $root 'bundle/SHA256SUMS.txt') -Encoding ascii)
          if ($entries.Count -lt 5 -or @($evidence.artifacts).Count -ne $entries.Count) {
            throw 'Missing or duplicate release evidence for an artifact'
          }
          $covered = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          $thumbprint = $null
          foreach ($item in @($evidence.artifacts)) {
            if (-not $covered.Add([string]$item.path)) {
              throw 'Duplicate provenance entry'
            }
            $manifest = $entries | Where-Object { $_ -ceq "$($item.sha256)  $($item.path)" }
            if (@($manifest).Count -ne 1) {
              throw 'Evidence hash or path differs from downloaded manifest'
            }
            $file = Get-Item -LiteralPath (Join-Path $root ([string]$item.path)) -ErrorAction Stop
            $digest = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($digest -cne [string]$item.sha256) {
              throw 'Downloaded artifact bytes differ from evidence'
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($expectedSigned) {
              if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate -or
                  -not $signature.TimeStamperCertificate -or
                  $signature.SignerCertificate.Thumbprint -cne $item.signer_thumbprint) {
                throw 'Downloaded Enterprise artifact signature failed independent verification'
              }
              if ($null -eq $thumbprint) { $thumbprint = $signature.SignerCertificate.Thumbprint }
              if ($thumbprint -cne $signature.SignerCertificate.Thumbprint) {
                throw 'Enterprise artifacts were signed with inconsistent identities'
              }
            }
          }
          $args = @{ ReleaseRoot = $root; RequireCompanions = $true }
          if ($expectedSigned) {
            if ($thumbprint -notmatch '^[0-9A-Fa-f]{40}$') { throw 'Enterprise certificate thumbprint missing' }
            $args.RequireSigned = $true
            $args.ExpectedThumbprint = $thumbprint
          }
          & ./tools/Verify-Pravda-Installer.ps1 @args
          Write-Host "Verified independently downloaded Windows release from commit $env:EXPECTED_COMMIT"
      - name: Verify unified setup executable without installing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path './downloaded-release/pravda-setup.exe' -ErrorAction Stop).Path
          $manifest = @(Get-Content -LiteralPath 'downloaded-release/bundle/SHA256SUMS.txt' -Encoding ascii)
          $digest = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if (@($manifest | Where-Object { $_ -ceq ($digest + '  pravda-setup.exe') }).Count -ne 1) {
            throw 'Unified setup does not match downloaded release manifest'
          }
          $process = Start-Process -FilePath $setup -ArgumentList '--verify-only' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Unified setup payload self-test failed' }
      - name: Download standalone production test application
        uses: actions/download-artifact@v8
        with:
          name: pravda-windows-production-test
          path: downloaded-test
      - name: Download standalone troubleshooting application
        uses: actions/download-artifact@v8
        with:
          name: pravda-windows-troubleshooting
          path: downloaded-doctor
      - name: Verify independent companion archives against main release manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = @(Get-Content -LiteralPath 'downloaded-release/bundle/SHA256SUMS.txt' -Encoding ascii)
          foreach ($case in @(
            @{ Folder = 'downloaded-test'; Exe = 'pravda-harness.exe'; Guide = 'PRODUCTION-TEST.txt' },
            @{ Folder = 'downloaded-doctor'; Exe = 'pravda-doctor.exe'; Guide = 'TROUBLESHOOTING.txt' }
          )) {
            $binary = Join-Path $case.Folder $case.Exe
            $guide = Join-Path $case.Folder $case.Guide
            if (-not (Test-Path -LiteralPath $guide -PathType Leaf)) { throw 'Missing independent companion instructions' }
            $hash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
            $matching = @($manifest | Where-Object { $_ -ceq ($hash + '  ' + $case.Exe) })
            if ($matching.Count -ne 1) { throw 'Independent companion does not match main release manifest' }
            Write-Host ('Verified standalone companion ' + $case.Exe + ' SHA256=' + $hash)
          }
      - name: Download single-click integrated production tester
        uses: actions/download-artifact@v8
        with:
          name: pravda-windows-one-click-test-center
          path: downloaded-center
      - name: Execute integrated diagnostic and verify report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $center = (Resolve-Path './downloaded-center/pravda-test-center.exe' -ErrorAction Stop).Path
          $hash = (Get-FileHash -LiteralPath $center -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @(Get-Content -LiteralPath 'downloaded-release/bundle/SHA256SUMS.txt' -Encoding ascii)
          if (@($manifest | Where-Object { $_ -ceq ($hash + '  pravda-test-center.exe') }).Count -ne 1) {
            throw 'Independent one-click tester is not listed in the trusted release manifest'
          }
          $env:PRAVDA_TEST_CENTER_REPORT_DIR = (Join-Path $env:RUNNER_TEMP 'pravda-one-click-acceptance')
          New-Item -ItemType Directory -Force $env:PRAVDA_TEST_CENTER_REPORT_DIR | Out-Null
          # GUI-subsystem PE binaries do not reliably populate LASTEXITCODE when
          # invoked directly from PowerShell. Wait for the process handle instead.
          $tester = Start-Process -FilePath $center -ArgumentList '--ci' -Wait -PassThru -NoNewWindow
          $testerExit = [int]$tester.ExitCode
          Write-Host ('Integrated tester exit code: ' + $testerExit)
          $files = @(Get-ChildItem -LiteralPath $env:PRAVDA_TEST_CENTER_REPORT_DIR -Recurse -File -ErrorAction SilentlyContinue)
          Write-Host ('Integrated tester generated file count: ' + $files.Count)
          # Only leaf names of fixed synthetic test outputs; never log private paths.
          foreach ($file in $files) {
            if ($file.Name -in @('PRAVDA-TEST-REPORT.json', 'PRAVDA-TEST-REPORT.html', 'pravda-app.exe', 'pravda-doctor.exe', 'pravda-harness.exe')) {
              Write-Host ('Integrated tester output type: ' + $file.Name)
            }
          }
          $reports = @($files | Where-Object { $_.Name -ceq 'PRAVDA-TEST-REPORT.json' })
          if ($reports.Count -ne 1) {
            throw ('Integrated test report missing or ambiguous; tester exit=' + $testerExit + '; generated files=' + $files.Count)
          }
          $report = Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
          foreach ($finding in $report.findings) {
            if ($finding.status -eq 'FAIL') { Write-Host ('Integrated FAIL check=' + $finding.check + ' detail=' + $finding.detail) }
          }
          if ($testerExit -ne 0) { throw 'Integrated tester terminated unsuccessfully; inspect retained report' }
          if ($report.schema_version -ne 1 -or $report.commit -ne '${{ github.sha }}') {
            throw 'Integrated report is not linked to the verified commit'
          }
          foreach ($check in @('doctor_startup','harness_smoke','desktop_process','synthetic_sqlite_health')) {
            $matching = @($report.findings | Where-Object check -EQ $check)
            if ($matching.Count -ne 1 -or $matching[0].status -ne 'PASS') {
              throw "Integrated test failed required check: $check"
            }
          }
          if (@($report.findings | Where-Object check -EQ 'desktop_gui' | Where-Object status -EQ 'SKIP').Count -ne 1) {
            throw 'GUI interaction must remain explicitly unverified in the integrated tester'
          }
      - name: Retain integrated diagnostic reports even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pravda-windows-integrated-diagnostic-report
          path: ${{ runner.temp }}/pravda-one-click-acceptance/**/PRAVDA-TEST-REPORT.*
          if-no-files-found: warn
          retention-days: 30
      - name: Smoke test independent downloaded Doctor and offline harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $doctor = @(& './downloaded-doctor/pravda-doctor.exe' --no-open)
          if ($LASTEXITCODE -ne 0 -or ($doctor -join [Environment]::NewLine) -notmatch 'PRAVDA-DOCTOR REPORT v2') {
            throw 'Standalone Doctor failed diagnostic startup'
          }
          $harness = @(& './downloaded-test/pravda-harness.exe' --smoke)
          if ($LASTEXITCODE -ne 0) { throw 'Standalone Harness synthetic smoke failed' }
          $summary = ($harness | Select-Object -Last 1) | ConvertFrom-Json
          if ($summary.aggregate.pass -ne 1 -or $summary.aggregate.rejected -ne 1 -or
              $summary.aggregate.timeout -ne 1 -or $summary.aggregate.crash -ne 1 -or
              $summary.build_accepted -ne $false) {
            throw 'Unexpected offline test harness synthetic results'
          }
          Write-Host 'PASS standalone Doctor and preproduction Harness synthetic smoke'
      # Match native WebView2/EdgeDriver on the same Windows image as security E2E.
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check installed GUI acceptance script syntax
        run: node --check tools/test-installed-onboarding.mjs
      - name: Install Tauri's native Windows WebDriver adapter
        run: cargo install tauri-driver --version '=2.1.0' --locked

      - name: Download matching EdgeDriver from Microsoft only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Tauri WebView2 uses Microsoft Edge WebView2 Runtime, NOT the
          # separate msedge.exe browser. Driver major must match runtime.
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $webview = Get-ItemProperty -LiteralPath $key -ErrorAction SilentlyContinue
          $version = $webview.pv
          if (-not $version -or $version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Cannot determine installed Microsoft WebView2 Runtime version; fail closed"
          }
          Write-Host "WebView2 Runtime version $version (registry)"
          $zipPath = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          $binDir = Join-Path $env:RUNNER_TEMP 'edgedriver-bin'
          $uri = "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip"
          Invoke-WebRequest -Uri $uri -OutFile $zipPath -ErrorAction Stop
          Expand-Archive -LiteralPath $zipPath -DestinationPath $binDir
          if (-not (Test-Path (Join-Path $binDir 'msedgedriver.exe'))) {
            throw "Microsoft EdgeDriver binary missing"
          }
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Matched Microsoft EdgeDriver version $version"
          "PRAVDA_E2E_WEBVIEW2_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PRAVDA_E2E_WINDOWS_VERSION=$([System.Environment]::OSVersion.VersionString)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke-test MSI installation and uninstall on pristine Windows
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath 'downloaded-release/bundle/msi' -Filter '*.msi' -File -ErrorAction Stop)
          if ($files.Count -ne 1) { throw 'Exactly one MSI release candidate is required' }
          & ./tools/Test-Pravda-Msi-Install.ps1 -MsiPath $files[0].FullName
      - name: Smoke-test NSIS installation and uninstall on pristine Windows
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath 'downloaded-release/bundle/nsis' -Filter '*-setup.exe' -File -ErrorAction Stop)
          if ($files.Count -ne 1) { throw 'Exactly one NSIS release candidate is required' }
          & ./tools/Test-Pravda-Nsis-Install.ps1 -NsisPath $files[0].FullName
      - name: Retain installed release GUI onboarding evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pravda-windows-installed-gui-onboarding
          path: |
            ${{ runner.temp }}/Pravda-msi-installed-onboarding.json
            ${{ runner.temp }}/Pravda-nsis-installed-onboarding.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain MSI installation failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pravda-windows-msi-smoke-failure-log
          path: ${{ runner.temp }}/pravda-msi-install.log
          if-no-files-found: ignore
          retention-days: 7

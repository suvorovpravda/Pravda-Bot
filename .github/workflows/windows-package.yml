name: Windows installer packaging (manual; optional Authenticode)
on:
  workflow_dispatch:
    inputs:
      signed:
        description: 'Require valid Authenticode signatures on EXE, NSIS and MSI'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Build Windows NSIS and MSI candidates
    runs-on: windows-latest
    environment: ${{ inputs.signed && 'windows-signing' || 'unsigned-test' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify root and Tauri locks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo metadata --locked --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Root Cargo.lock is stale' }
          cargo metadata --locked --manifest-path crates/pravda-app/Cargo.toml --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Desktop Cargo.lock is stale' }
      - name: Install Tauri 2 CLI
        shell: pwsh
        run: |
          cargo install tauri-cli --version '^2' --locked
          if ($LASTEXITCODE -ne 0) { throw 'Tauri CLI install failed' }
      - name: Import code-signing certificate (explicit manual opt-in)
        if: ${{ inputs.signed }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference='Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'Code-signing secrets missing from windows-signing environment'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'pravda-temporary-code-sign.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $cert -or -not $cert.HasPrivateKey -or $cert.NotAfter -le (Get-Date)) {
              throw 'Valid non-expired code signing certificate with private key required'
            }
            $eku = @($cert.EnhancedKeyUsageList | ForEach-Object { $_.ObjectId.Value })
            if ($eku -notcontains '1.3.6.1.5.5.7.3.3') {
              throw 'Certificate does not allow code signing'
            }
            "PRAVDA_SIGNING_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
            Remove-Item Env:WINDOWS_CERTIFICATE_BASE64 -ErrorAction SilentlyContinue
            Remove-Item Env:WINDOWS_CERTIFICATE_PASSWORD -ErrorAction SilentlyContinue
          }
      - name: Configure Tauri code signing before building EXE and installers
        if: ${{ inputs.signed }}
        shell: pwsh
        working-directory: crates/pravda-app
        run: |
          $ErrorActionPreference='Stop'
          if ($env:PRAVDA_SIGNING_THUMBPRINT -notmatch '^[0-9A-Fa-f]{40}$') {
            throw 'Signing certificate thumbprint was not validated'
          }
          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $env:PRAVDA_SIGNING_THUMBPRINT
                digestAlgorithm = 'sha256'
                timestampUrl = 'http://timestamp.digicert.com'
              }
            }
          }
          $config | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath 'tauri.signing.ci.json' -Encoding utf8
      - name: Build NSIS and MSI with locked Cargo dependencies
        shell: pwsh
        working-directory: crates/pravda-app
        env:
          PRAVDA_SIGNED: ${{ inputs.signed }}
        run: |
          $ErrorActionPreference='Stop'
          if ($env:PRAVDA_SIGNED -eq 'true') {
            cargo tauri build --ci --config tauri.signing.ci.json --bundles nsis,msi -- --locked
          } else {
            cargo tauri build --ci --bundles nsis,msi -- --locked
          }
          if ($LASTEXITCODE -ne 0) { throw 'Tauri Windows package build failed' }
      - name: Verify EXE/MSI/NSIS and fail closed when signing was requested
        shell: pwsh
        env:
          PRAVDA_SIGNED: ${{ inputs.signed }}
        run: |
          $ErrorActionPreference='Stop'
          $dir='crates/pravda-app/target/release/bundle'
          $msi=@(Get-ChildItem "$dir/msi" -Filter '*.msi' -File -ErrorAction SilentlyContinue)
          $nsis=@(Get-ChildItem "$dir/nsis" -Filter '*-setup.exe' -File -ErrorAction SilentlyContinue)
          $exe=Get-Item -LiteralPath 'crates/pravda-app/target/release/pravda-app.exe' -ErrorAction Stop
          if ($msi.Count -lt 1 -or $nsis.Count -lt 1) { throw 'MSI or NSIS installer missing' }
          foreach ($file in @($exe)+@($msi)+@($nsis)) {
            $hash=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "$($file.Name) SHA256=$hash"
            $sig=Get-AuthenticodeSignature -FilePath $file.FullName
            if ($env:PRAVDA_SIGNED -eq 'true') {
              if ($sig.Status -ne 'Valid' -or
                  $sig.SignerCertificate.Thumbprint -ne $env:PRAVDA_SIGNING_THUMBPRINT -or
                  -not $sig.TimeStamperCertificate) {
                throw "Signature, certificate or timestamp missing/invalid for $($file.Name)"
              }
            } elseif ($sig.Status -ne 'Valid') {
              Write-Warning "UNSIGNED TEST PACKAGE ONLY: $($file.Name). Not an Enterprise release."
            }
          }
      - name: Generate SHA-256 release candidate manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'crates/pravda-app/target/release/bundle'
          $exe = Get-Item 'crates/pravda-app/target/release/pravda-app.exe' -ErrorAction Stop
          $msi = @(Get-ChildItem "$bundle/msi" -Filter '*.msi' -File -ErrorAction Stop)
          $nsis = @(Get-ChildItem "$bundle/nsis" -Filter '*-setup.exe' -File -ErrorAction Stop)
          if ($msi.Count -eq 0 -or $nsis.Count -eq 0) { throw 'Installers missing; cannot produce manifest' }
          $files = @($exe) + $msi + $nsis
          $manifest = foreach ($file in ($files | Sort-Object FullName)) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = [IO.Path]::GetRelativePath((Get-Location).Path, $file.FullName).Replace([char]92, '/')
            "$hash  $relative"
          }
          $manifest | Set-Content -LiteralPath "$bundle/SHA256SUMS.txt" -Encoding ascii
          if ((Get-Content "$bundle/SHA256SUMS.txt").Count -ne $files.Count) {
            throw 'Incomplete release candidate manifest'
          }
      - name: Clean up temporary signing config
        if: always()
        shell: pwsh
        run: |
          Remove-Item 'crates/pravda-app/tauri.signing.ci.json' -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v7
        with:
          name: pravda-windows-${{ inputs.signed && 'signed' || 'unsigned' }}-candidate-installers
          path: |
            crates/pravda-app/target/release/bundle/msi/*.msi
            crates/pravda-app/target/release/bundle/nsis/*-setup.exe
            crates/pravda-app/target/release/bundle/SHA256SUMS.txt
            crates/pravda-app/target/release/pravda-app.exe
          if-no-files-found: error
          retention-days: 3

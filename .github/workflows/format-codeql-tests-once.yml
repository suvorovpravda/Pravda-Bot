name: Format CodeQL test fixes once
on:
  push:
    branches:
      - fix/codeql-auth-test-fixtures-20261101

permissions:
  contents: write

jobs:
  format-and-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Remove one-time formatter workflow
        run: rm .github/workflows/format-codeql-tests-once.yml
      - name: Commit formatted test sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style(tests): format security fixtures and assertions"
            git push origin HEAD:fix/codeql-auth-test-fixtures-20261101
          fi

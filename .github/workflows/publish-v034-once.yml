name: Publish Pravda-Bot v0.3.4 Windows once
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v034-once.yml]
permissions:
  contents: write
  actions: read

jobs:
  windows:
    name: Compile, exercise auth and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 205a68b5179cfb3ae9479e93844430288400c92b
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test dashboard JavaScript
        run: node tools/test-dashboard.mjs
      - name: Build optimised Windows executable
        run: cargo build --locked --release --manifest-path crates/pravda-app/Cargo.toml
      - name: Smoke-test executable, setup, dashboard and logout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $probe = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $probe.Start()
          $port = $probe.LocalEndpoint.Port
          $probe.Stop()
          $env:DASHBOARD_PORT = "$port"
          $env:PRAVDA_MARKET_FEEDS_ENABLED = "false"
          $env:PRAVDA_DB_PATH = Join-Path $env:RUNNER_TEMP "pravda-v034-smoke.db"
          $env:PRAVDA_AUTH_PATH = Join-Path $env:RUNNER_TEMP "pravda-v034-auth.json"
          $exe = Join-Path (Get-Location).Path "crates/pravda-app/target/release/pravda-app.exe"
          if (-not (Test-Path $exe)) { throw "Windows release executable missing" }
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 90; $i++) {
              $process.Refresh()
              if ($process.HasExited) { throw "Release exe exited before setup" }
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:$port/login" -TimeoutSec 2 -MaximumRedirection 0
                if ($r.StatusCode -eq 200 -and $r.Headers["x-pravda-server"] -eq "1") {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw "Local authentication server did not start" }
            $headers = @{
              "Sec-Fetch-Site" = "cross-site"
              "Sec-Fetch-Mode" = "navigate"
              "Sec-Fetch-Dest" = "document"
            }
            $nav = Invoke-WebRequest "http://127.0.0.1:$port/login" -Headers $headers -TimeoutSec 3 -MaximumRedirection 0
            if ($nav.StatusCode -ne 200 -or $nav.Content -notmatch "Pravda-Bot") {
              throw "Initial WebView2 navigation failed"
            }
            $handler = [System.Net.Http.HttpClientHandler]::new()
            $handler.AllowAutoRedirect = $false
            $handler.UseCookies = $true
            $handler.CookieContainer = [System.Net.CookieContainer]::new()
            $http = [System.Net.Http.HttpClient]::new($handler)
            try {
              $base = "http://127.0.0.1:$port"
              $unauth = $http.GetAsync("$base/api/market").GetAwaiter().GetResult()
              if ([int]$unauth.StatusCode -ne 401) { throw "Unauthenticated API access was not blocked" }

              $password = [Convert]::ToHexString([System.Security.Cryptography.RandomNumberGenerator]::GetBytes(20))
              $fields = [System.Collections.Generic.Dictionary[string,string]]::new()
              $fields.Add("password", $password)
              $fields.Add("confirm", $password)
              $setup = $http.PostAsync("$base/setup", [System.Net.Http.FormUrlEncodedContent]::new($fields)).GetAwaiter().GetResult()
              if ([int]$setup.StatusCode -ne 303) { throw "First-use setup failed" }

              $dash = $http.GetAsync("$base/").GetAwaiter().GetResult()
              if ([int]$dash.StatusCode -ne 200) { throw "Authenticated dashboard did not load" }
              $html = $dash.Content.ReadAsStringAsync().GetAwaiter().GetResult()
              if (-not $html.Contains('id="chart-currency"><option>USDT</option>')) {
                throw "USDT native quote chart not packaged into release"
              }
              if (-not $html.Contains("priceAlertsUnavailable")) {
                throw "Unsupported threshold alert state missing"
              }
              if (-not $html.Contains("setInterval(refreshHistory, 30000)")) {
                throw "Bounded history polling not included"
              }

              $market = $http.GetAsync("$base/api/market").GetAwaiter().GetResult()
              if ([int]$market.StatusCode -ne 200) { throw "Authenticated market API failed" }
              $history = $http.GetAsync("$base/api/market/history").GetAwaiter().GetResult()
              if ([int]$history.StatusCode -ne 200) { throw "Authenticated history API failed" }

              $attack = [System.Net.Http.HttpRequestMessage]::new([System.Net.Http.HttpMethod]::Get, "$base/api/market")
              $attack.Headers.TryAddWithoutValidation("Origin", "http://attacker.invalid") | Out-Null
              $blocked = $http.SendAsync($attack).GetAwaiter().GetResult()
              if ([int]$blocked.StatusCode -ne 403) { throw "External Origin restriction failed" }

              $logout = $http.PostAsync("$base/logout", [System.Net.Http.StringContent]::new("")).GetAwaiter().GetResult()
              if ([int]$logout.StatusCode -ne 303) { throw "Logout failed" }
              $revoked = $http.GetAsync("$base/api/market").GetAwaiter().GetResult()
              if ([int]$revoked.StatusCode -ne 401) { throw "Logout did not revoke session" }
            } finally {
              $http.Dispose()
              $handler.Dispose()
            }
            Write-Host "v0.3.4 Windows release, WebView2, USDT dashboard and session security verified."
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Package ZIP and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force release-stage,release-dist | Out-Null
          Copy-Item crates/pravda-app/target/release/pravda-app.exe release-stage/pravda-app.exe
          Copy-Item README.md release-stage/README.md
          Copy-Item SECURITY.md release-stage/SECURITY.md
          Copy-Item docs/releases/v0.3.4.md release-stage/RELEASE_NOTES.md
          Compress-Archive -Path release-stage/* -DestinationPath release-dist/Pravda-Bot-v0.3.4-Windows-x64.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 release-dist/Pravda-Bot-v0.3.4-Windows-x64.zip).Hash.ToLowerInvariant()
          "$hash  Pravda-Bot-v0.3.4-Windows-x64.zip" | Set-Content -Encoding ascii release-dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pravda-bot-v0.3.4-windows
          path: release-dist/*
          if-no-files-found: error

  publish:
    name: Publish immutable v0.3.4 only after verified source CI
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 205a68b5179cfb3ae9479e93844430288400c92b
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 205a68b5179cfb3ae9479e93844430288400c92b
      - uses: actions/download-artifact@v4
        with:
          name: pravda-bot-v0.3.4-windows
          path: release-dist
      - name: Check source unchanged, tests and archive checksum
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            changed="$(gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...$current" --jq '.files[].filename')"
            test "$changed" = ".github/workflows/publish-v034-once.yml" || {
              echo "Main contains unreviewed source changes; abort release"
              exit 1
            }
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.3.4" >/dev/null 2>&1; then
              echo "v0.3.4 already exists; will never overwrite immutable release"
              exit 1
            fi
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=60")"
            if echo "$runs" | jq -e --arg sha "$SOURCE_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha and .event == "push")] as $r
              | (any($r[]; .name == "Rust migration" and .conclusion == "success"))
                and (any($r[]; .name == "CodeQL Advanced" and .conclusion == "success"))
            ' >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Mandatory Rust and CodeQL checks did not succeed for source SHA"
              exit 1
            fi
            sleep 15
          done
          test -s release-dist/Pravda-Bot-v0.3.4-Windows-x64.zip
          (cd release-dist && sha256sum -c SHA256SUMS.txt)
      - name: Create new v0.3.4 prerelease
        shell: bash
        run: |
          gh release create v0.3.4 \
            release-dist/Pravda-Bot-v0.3.4-Windows-x64.zip \
            release-dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Pravda-Bot v0.3.4 — Dashboard reliability" \
            --notes-file docs/releases/v0.3.4.md \
            --prerelease

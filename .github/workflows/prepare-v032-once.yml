name: Prepare v0.3.2 lockfiles once
on:
  push:
    branches: [fix/tauri-webview2-initial-navigation-origin]
permissions:
  contents: write
jobs:
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Format both workspaces
        run: |
          cargo fmt --all
          cargo fmt --manifest-path crates/pravda-app/Cargo.toml
      - name: Update workspace lockfiles without upgrading other dependencies
        run: |
          cargo update --workspace
          cargo update --manifest-path crates/pravda-app/Cargo.toml --workspace
      - name: Remove temporary workflow and commit generated changes
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-v032-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): refresh v0.3.2 lockfiles and formatting"
            git push origin HEAD:fix/tauri-webview2-initial-navigation-origin
          fi

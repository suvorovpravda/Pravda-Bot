name: "Live README & Security cockpit"

on:
  schedule:
    # GitHub cron is best effort: minimum practical interval is 5 min.
    - cron: "*/10 * * * *"
  workflow_run:
    workflows:
      - "Rust migration"
      - "Windows installer packaging (manual; optional Authenticode)"
      - "CodeQL Advanced"
      - "RustSec dependency audit (observe only)"
    types: [completed]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/live-docs.yml"
      - "tools/update-live-dashboard.mjs"
      - "docs/assets/pravda-live-status.svg"
      - "docs/assets/pravda-live-status.json"
      - "README.md"
      - "SECURITY.md"
      - "docs/PRAVDA-GUIDE.md"

permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: pravda-live-docs-main
  cancel-in-progress: false

jobs:
  update:
    # Do not allow PR workflow_run events to cause privileged repository writes.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify honest percentages, SHA matching and audit boundaries
        run: node tools/update-live-dashboard.mjs --test
      - name: Aggregate live CI, open PR/issue counts and guide progression
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
        run: node tools/update-live-dashboard.mjs
      - name: Commit only changed status evidence (not a new build)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git add docs/assets/pravda-live-status.svg docs/assets/pravda-live-status.json
          if git diff --cached --quiet; then
            echo "No observable change; no unnecessary 10-minute heartbeat commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "docs(live): refresh GitHub cockpit evidence [skip ci]"
          git push origin HEAD:main
          echo "Updated source evidence and SVG on main."

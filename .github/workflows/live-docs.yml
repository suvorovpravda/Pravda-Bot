name: "Live README & Security cockpit"

on:
  # A merge to protected main must refresh the status feed immediately,
  # without waiting for CI completion or the best-effort cron scheduler.
  push:
    branches: [main]
  schedule:
    # GitHub cron is best effort: minimum practical interval is 5 min.
    - cron: "*/10 * * * *"
  workflow_run:
    workflows:
      - "Rust migration"
      - "Windows installer packaging (manual; optional Authenticode)"
      - "CodeQL Advanced"
      - "RustSec dependency audit (blocking)"
    types: [completed]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/live-docs.yml"
      - "tools/update-live-dashboard.mjs"
      - "docs/assets/pravda-live-status.svg"
      - "docs/assets/pravda-live-status.json"
      - "README.md"
      - "SECURITY.md"
      - "docs/PRAVDA-GUIDE.md"

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: pravda-live-docs-main
  cancel-in-progress: false

jobs:
  verify_pr:
    # Only branches within this trusted repository may execute its JS in CI.
    # Fork PRs are intentionally skipped, never treated as a verified PASS.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Enforce exact checked-out source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Checked-out SHA differs from the required source SHA"
            exit 1
          fi
          echo "Verified source SHA=$actual"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "22"
      - name: Validate historical data, SVG and security semantics without network
        run: node tools/update-live-dashboard.mjs --test
      - name: Read exact SonarCloud PR issue details (diagnostic, never release approval)
        # Public SonarCloud API only. No tokens, PR credentials, or writable permissions.
        env:
          SONAR_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'NODE'
          const url = new URL("https://sonarcloud.io/api/issues/search");
          for (const [k,v] of Object.entries({
            componentKeys: "suvorovpravda_Pravda-Bot",
            pullRequest: process.env.SONAR_PR_NUMBER,
            resolved: "false",
            ps: "100"
          })) url.searchParams.set(k,v);
          try {
            const r=await fetch(url,{headers:{Accept:"application/json"},signal:AbortSignal.timeout(15000)});
            console.log("SONAR_PR_ISSUES_HTTP_STATUS="+r.status);
            if (!r.ok) {
              console.log("SONAR_PR_ISSUES_UNAVAILABLE: cannot infer zero findings");
            } else {
              const data=await r.json();
              const issues=Array.isArray(data.issues)?data.issues:null;
              if (!issues) throw Error("SonarCloud issues schema missing");
              console.log("SONAR_PR_ISSUES_TOTAL="+data.total);
              for (const issue of issues) {
                console.log("SONAR_PR_ISSUE="+JSON.stringify({
                  key:issue.key,rule:issue.rule,component:issue.component,
                  line:issue.line??issue.textRange?.startLine??null,
                  type:issue.type,severity:issue.severity,
                  impacts:issue.impacts?.map(i=>({quality:i.softwareQuality,severity:i.severity})),
                  message:String(issue.message??"").slice(0,240)
                }));
              }
            }
          } catch(e) {
            console.log("SONAR_PR_ISSUES_UNAVAILABLE: "+String(e?.name||"fetch_error"));
          }
          NODE

  update:
    # Privileged updates must NEVER execute a PR's untrusted code.
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "22"
      - name: Verify honest percentages, SHA matching and audit boundaries
        run: node tools/update-live-dashboard.mjs --test
      - name: Aggregate live CI, open PR/issue counts and guide progression
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
        run: node tools/update-live-dashboard.mjs
      # GitHub rulesets require all main changes to arrive via reviewed PRs.
      # The live SVG/JSON feed is published to a dedicated branch, leaving main
      # protected. README.md and SECURITY.md display this feed by URL.
      - name: Publish observable evidence to status/live (never push main)
        shell: bash
        run: |
          set -euo pipefail
          branch="status/live"
          test -s docs/assets/pravda-live-status.svg
          test -s docs/assets/pravda-live-status.json
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const s=JSON.parse(readFileSync("docs/assets/pravda-live-status.json","utf8"));
            if(s.schema!=="PRAVDA-STATUS-v1" || !/^[a-f0-9]{40}$/.test(s.source_sha||"")
              || s.production!=="NO-GO" || s.trading_live!=="OFF"
              || s.signed_updater!=="OFF") {
              throw Error("Reject invalid or unsafe live status payload");
            }
          '
          target="$(mktemp -d)"
          cleanup() { git worktree remove --force "$target" >/dev/null 2>&1 || true; rmdir "$target" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            git worktree add --detach "$target" "refs/remotes/origin/$branch"
          else
            git worktree add --detach "$target" HEAD
          fi
          mkdir -p "$target/docs/assets"
          cp docs/assets/pravda-live-status.{json,svg} "$target/docs/assets/"
          (
            cd "$target"
            git add docs/assets/pravda-live-status.json docs/assets/pravda-live-status.svg
            if git diff --cached --quiet; then
              echo "Live feed unchanged; no heartbeat commit."
              exit 0
            fi
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "docs(live): refresh verifiable main-branch evidence [skip ci]"
            git push origin "HEAD:refs/heads/$branch"
            echo "Published status/live; main branch protection remains enabled."
          )

# Dependabot configuration for Pravda-Bot
# Documentation: https://docs.github.com/en/code-security/supply-chain-security/configuring-dependabot-version-updates

version: 2

updates:
  # ─── Rust (Cargo) ───────────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "12:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    reviewers:
      - "suvorovpravda"
    labels:
      - "dependencies"
      - "rust"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      - dependency-name: "tokio"
        update-types: ["version-update:semver-major"]
      - dependency-name: "axum"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pyo3"
        update-types: ["version-update:semver-major"]
    groups:
      rust-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ─── GitHub Actions ─────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "12:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    reviewers:
      - "suvorovpravda"
    labels:
      - "dependencies"
      - "ci"
      - "security"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  # ─── Python (archive legacy) ────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/archive/python-legacy"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "12:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 2
    reviewers:
      - "suvorovpravda"
    labels:
      - "dependencies"
      - "python"
      - "archive"
    commit-message:
      prefix: "deps(python)"
      include: "scope"
    ignore:
      - dependency-name: "ccxt"
        update-types: ["version-update:semver-major"]

  # ─── JavaScript/TypeScript (dashboard frontend) ─────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "12:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    reviewers:
      - "suvorovpravda"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "deps(js)"
      include: "scope"
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

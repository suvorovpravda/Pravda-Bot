# Dependabot configuration for Pravda-Bot
# Documentation: https://docs.github.com/en/code-security/supply-chain-security/configuring-dependabot-version-updates

version: 2

updates:
  # ─── Rust (Cargo) ───────────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "12:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    reviewers:
      - "suvorovpravda"
    labels:
      - "dependencies"
      - "rust"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      - dependency-name: "tokio"
        update-types: ["version-update:semver-major"]
      - dependency-name: "axum"
        update-types: ["version-update:semver-major"]
    groups:
      rust-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ─── GitHub Actions ─────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    # MSRV changes are deliberate compatibility decisions, not action upgrades.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "12:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    reviewers:
      - "suvorovpravda"
    labels:
      - "dependencies"
      - "ci"
      - "security"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  # Python is archived as non-executable historical reference.
  # The repository has no active Python package or npm package.json at root.
  # Do not emit dependency-update PRs for retired packaging metadata.

# Configuration CodeQL pour Pravda-Bot
# Exclut le code archivé et les fichiers de test non pertinents

name: "CodeQL config"

# Exclure les chemins du scan
paths-ignore:
  - archive/
  - archive/python-legacy/
  - archive/python-legacy/**
  - tests_js/
  - tests_js/**
  - "**/*.test.js"
  - "**/*.test.ts"
  - "**/*.test.jsx"
  - "**/*.test.tsx"
  - node_modules/
  - "**/node_modules/"
  - target/
  - "**/target/"
  - .venv/
  - "**/.venv/"
  - __pycache__/
  - "**/__pycache__/"

# Ne scanner que les chemins actifs
paths:
  - rust/
  - crates/
  - src/
  - tests/
  - dashboard.html
  - dashboard.py
  - main.py
  - "*.py"
  - "*.rs"
  - "*.js"
  - "*.ts"

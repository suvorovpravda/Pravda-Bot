[package]
name = "pravda-server"
version = "0.3.1"
edition = "2021"
rust-version.workspace = true

[dependencies]
pravda-market-core = { path = "../market-core" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors"] }
pravda-fetchers = { path = "../../crates/pravda-fetchers" }
pravda-engine = { path = "../../crates/pravda-engine" }
pravda-store = { path = "../../crates/pravda-store" }
futures-util = "0.3"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
pbkdf2 = "0.12"
sha2 = "0.10"
getrandom = "0.2"
subtle = "2"

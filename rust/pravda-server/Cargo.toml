[package]
name = "pravda-server"
version = "0.3.4"
edition = "2021"
rust-version.workspace = true

[dependencies]
pravda-market-core = { path = "../market-core" }
pravda-core = { path = "../../crates/pravda-core" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors"] }
pravda-fetchers = { path = "../../crates/pravda-fetchers" }
pravda-engine = { path = "../../crates/pravda-engine" }
pravda-store = { path = "../../crates/pravda-store" }
futures-util = "0.3"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
pbkdf2 = "0.13"
sha2 = "0.11"
getrandom = "0.4"
subtle = "2"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
rpassword = "7"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
zeroize = "1.9"

[dev-dependencies]
base64 = "0.22"
ring = "0.17"

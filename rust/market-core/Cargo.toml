[package]
name = "pravda-market-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
r2d2 = "0.8.10"
r2d2_sqlite = { version = "0.35.0", features = ["bundled"] }
rusqlite = "0.40.0"
pyo3 = { version = "0.22", features = ["extension-module"] }

[dev-dependencies]
tempfile = "3.27.0"

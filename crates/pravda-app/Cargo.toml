[package]
name = "pravda-app"
version = "0.3.4"
edition = "2021"
description = "Pravda-Bot desktop app with Tauri"

# Explicit opt-in for debug-only native WebView2 security acceptance.
# No probe window is built in release binaries, even with this feature.
[features]
security-e2e = []
# Official signed update checks are opt-in at COMPILE TIME.
# Normal unsigned/offline builds do not load the updater or contact the network.
signed-updater = ["dep:tauri-plugin-updater"]

[workspace]

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
pravda-server = { path = "../../rust/pravda-server" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = { version = "=2.14.1", optional = true }

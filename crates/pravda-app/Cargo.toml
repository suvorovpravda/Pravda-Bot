[package]
name = "pravda-app"
version = "0.3.4"
edition = "2021"
description = "Pravda-Bot desktop app with Tauri"

# Explicit opt-in for debug-only native WebView2 security acceptance.
# No probe window is built in release binaries, even with this feature.
[features]
security-e2e = []
signed-updater-runtime = ["dep:tauri-plugin-updater", "dep:base64", "dep:minisign-verify", "dep:serde_json"]

[workspace]

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
pravda-server = { path = "../../rust/pravda-server" }

[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = { version = "=2.14.1", optional = true, default-features = false, features = ["rustls-tls"] }
base64 = { version = "=0.23.1", optional = true }
minisign-verify = { version = "=0.3.0", optional = true }
serde_json = { version = "1", optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }

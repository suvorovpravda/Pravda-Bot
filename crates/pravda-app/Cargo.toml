[package]
name = "pravda-app"
version = "0.1.0"
edition = "2021"
description = "Pravda-Bot desktop app with Tauri"

[workspace]

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
pravda-server = { path = "../../rust/pravda-server" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

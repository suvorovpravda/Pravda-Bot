# SonarQube Cloud automatic analysis for Pravda-Bot.
# Live application: Rust/Tauri. Historical Python is retained under archive/.
# This Python version is evidenced by archive/python-legacy/root-packaging/pyproject.toml
# (requires-python >=3.12,<3.13) and the archived uv requirements lock.
sonar.python.version=3.12

# Analyze all production and historical sources, including Rust, JavaScript,
# GitHub Actions, and the archived Python code. Do not hide legacy alerts.
sonar.sources=.

# The legacy Python tests and JS regression tests are tests, not product code.
# Source-only exclusions below prevent double indexing; they remain inside
# sonar.tests and are NOT suppressed from test-code analysis.
sonar.tests=archive/python-legacy/tests,tests_js
sonar.exclusions=archive/python-legacy/tests/**,tests_js/**

# SonarQube Cloud automatic analysis for Pravda-Bot.
# Live application: Rust/Tauri. Historical Python is retained under archive/.
# This Python version is evidenced by archive/python-legacy/root-packaging/pyproject.toml
# (requires-python >=3.12,<3.13) and the archived uv requirements lock.
sonar.python.version=3.12

# Analyze active Rust/Tauri, JavaScript, tooling, and GitHub Actions.
# The retired Python implementation is retained for historical reference,
# but is not part of the desktop product or its active test suite.
sonar.sources=.

# Keep active JavaScript regression tests indexed as tests, not production.
# Limit source exclusions to that test root and the retired archive; tools/
# and production frontend remain fully included in security analysis.
sonar.tests=tests_js
sonar.exclusions=archive/**,tests_js/**
